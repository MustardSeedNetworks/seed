    securitySchemes:
        BearerAuth:
            description: |
                Session access token from POST /api/v1/auth/login, sent as the seed_access cookie or an Authorization bearer, or a personal access token.
            scheme: bearer
            type: http
        CsrfToken:
            description: Per-session CSRF token from GET /api/v1/auth/csrf.
            in: header
            name: X-CSRF-Token
            type: apiKey
info:
    contact:
        name: Mustard Seed Networks
        url: https://github.com/MustardSeedNetworks/seed
    description: |
        REST API of the Seed daemon: network diagnostics, discovery and
        topology, Wi-Fi troubleshooting, security posture, compliance,
        alerting and reporting. The web UI and the `seed` CLI are both clients
        of it.

        ## Authentication
        Operations with the `BearerAuth` requirement need the access token that
        `POST /api/v1/auth/login` returns, or a personal access token
        (`sd_pat_…`). The browser presents the session as the `seed_access`
        cookie; API clients send `Authorization: Bearer`. `/__version` and
        `/__capabilities` are deliberately unauthenticated deployment
        introspection.

        ## CSRF protection
        Operations marked with the `CsrfToken` security scheme need a token from
        `GET /api/v1/auth/csrf` in the `X-CSRF-Token` header. Tokens are per
        session. A request authenticated by a personal access token carries no
        ambient credential and is not checked for CSRF.

        ## Roles and licence tiers
        Operations that require an operator-scoped token say so. Admin-only
        operations check the role in the handler. An operation outside the
        active licence answers 402 Payment Required.

        ## Rate limiting
        Routes marked rate limited share a per-IP endpoint budget and answer 429
        once it is spent.
    license:
        name: Business Source License 1.1
        url: https://github.com/MustardSeedNetworks/seed/blob/main/LICENSE
    title: The Seed API
    version: v1
