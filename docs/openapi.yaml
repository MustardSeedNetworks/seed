    /api/v1/sso/callback:
        get:
            description: |
                The provider redirects the browser here. The state must match the oauth_state cookie /sso/login set. On success the session cookies are set and the browser is sent to the UI; every failure is a redirect too, naming the reason in sso_error.
            operationId: getApiV1SsoCallback
            parameters:
                - description: The authorization code to exchange.
                  in: query
                  name: code
                  schema:
                    type: string
                - description: The state /sso/login issued.
                  in: query
                  name: state
                  schema:
                    type: string
                - description: Set by the provider when the user or provider refused.
                  in: query
                  name: error
                  schema:
                    type: string
                - description: The provider's reason for error.
                  in: query
                  name: error_description
                  schema:
                    type: string
            responses:
                "307":
                    description: |
                        Redirect to / when signed in, with the seed_access and seed_refresh cookies set, or to /?sso_error=<reason> when the handshake failed.
                    headers:
                        Location:
                            description: / or /?sso_error=<reason>.
                            schema:
                                type: string
                "405":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Method not allowed; the Allow header lists the accepted set.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal error.
            security: []
            summary: Finish a single sign-on handshake
    /api/v1/sso/login:
        get:
            description: |
                A browser navigation, not an API call. Sets the oauth_state and oauth_provider cookies, scoped to /api/v1/sso, and redirects to the provider's sign-in page.
            operationId: getApiV1SsoLogin
            parameters:
                - description: A configured, enabled provider (google, microsoft or github).
                  in: query
                  name: provider
                  required: true
                  schema:
                    type: string
            responses:
                "307":
                    description: Redirect to the provider's authorization URL, carrying the state the callback checks.
                    headers:
                        Location:
                            description: The provider's authorization URL.
                            schema:
                                format: uri
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: The provider parameter is missing, or names no enabled provider.
                "405":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Method not allowed; the Allow header lists the accepted set.
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Internal error.
            security: []
            summary: Start a single sign-on handshake with a provider
