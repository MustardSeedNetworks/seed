    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubnetDecisionRequest'
    responses:
      "200":
        description: The decision was recorded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
