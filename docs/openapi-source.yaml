  GET /api/v1/security/discovery/options:
    responses:
      "200":
        description: The discovery options in force.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryOptionsResponse'
  PUT /api/v1/security/discovery/options:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryOptions'
    responses:
      "200":
