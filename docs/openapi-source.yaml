        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VulnerabilityResultsResponse'
  GET /api/v1/security/vulnerabilities/settings:
    responses:
      "200":
        description: The vulnerability scan settings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VulnerabilitySettings'
  PUT /api/v1/security/vulnerabilities/settings:
    requestBody:
      required: true
      content:
        application/json:
          schema:
