  PUT /api/v1/security/guest-audit/settings:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GuestNetworkAuditConfig'
    responses:
      "200":
        description: The guest network audit settings were saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdatedResponse'
  GET /api/v1/security/problems:
    responses:
      "200":
        description: The detected network problems.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkProblemsResponse'
  POST /api/v1/security/problems/scan:
    responses:
      "200":
        description: The problems the scan found.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemScanResponse'
  GET /api/v1/security/problems/thresholds:
    responses:
      "200":
        description: The thresholds the problem detector applies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemThresholds'
  PUT /api/v1/security/problems/thresholds:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemThresholds'
    responses:
      "200":
        description: The thresholds were saved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  GET /api/v1/security/vulnerabilities/device:
