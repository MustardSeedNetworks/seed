                $ref: '#/components/schemas/SubnetResponse'
  POST /api/v1/security/devices/subnets:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubnetRequest'
    responses:
      "200":
        description: The subnet was added.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  PUT /api/v1/security/devices/subnets:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubnetRequest'
    responses:
      "200":
        description: The subnet was updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  DELETE /api/v1/security/devices/subnets:
    responses:
      "200":
