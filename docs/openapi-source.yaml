# openapi-source.yaml — the hand-written half of docs/openapi.yaml.
#
# docs/openapi.yaml is GENERATED (`make openapi`) and must not be edited. Its
# `paths` block comes from the route registry (internal/api Server.routes), so
# every registered route is documented with the policy it actually carries
# (auth, CSRF, operator scope, rate limit, body cap) and no route can be
# missing. The error schema comes from the Go type api.ErrorResponse, and
# components.schemas holds every DTO of internal/api/apischema, reflected from
# the Go types the handlers decode and send.
#
# What the registry cannot know (prose, path parameter names, which DTO an
# operation takes and returns) lives here. A body is a $ref to one of those
# components; a $ref naming none fails the generator.
#
#   preamble   verbatim top-level keys: info, servers, tags, components…
#   operations keyed "<METHOD> <path>", merged onto the generated operation.
#              `pathTemplate` renames a prefix route (a path ending in "/")
#              to its real shape.
#
# An operations key naming a path or method the registry does not serve fails
# the generator, so this file cannot outlive the routes it describes.

preamble:
  openapi: 3.1.0
  info:
    title: The Seed API
    description: |
      REST API of the Seed daemon: network diagnostics, discovery and
      topology, Wi-Fi troubleshooting, security posture, compliance,
      alerting and reporting. The web UI and the `seed` CLI are both clients
      of it.

      ## Authentication
      Operations with the `BearerAuth` requirement need the access token that
      `POST /api/v1/auth/login` returns, or a personal access token
      (`sd_pat_…`). The browser presents the session as the `seed_access`
      cookie; API clients send `Authorization: Bearer`. `/__version` and
      `/__capabilities` are deliberately unauthenticated deployment
      introspection.

      ## CSRF protection
      Operations marked with the `CsrfToken` security scheme need a token from
      `GET /api/v1/auth/csrf` in the `X-CSRF-Token` header. Tokens are per
      session. A request authenticated by a personal access token carries no
      ambient credential and is not checked for CSRF.

      ## Roles and licence tiers
      Operations that require an operator-scoped token say so. Admin-only
      operations check the role in the handler. An operation outside the
      active licence answers 402 Payment Required.

      ## Rate limiting
      Routes marked rate limited share a per-IP endpoint budget and answer 429
      once it is spent.
    version: v1
    contact:
      name: Mustard Seed Networks
      url: https://github.com/MustardSeedNetworks/seed
    license:
      name: Business Source License 1.1
      url: https://github.com/MustardSeedNetworks/seed/blob/main/LICENSE
  servers:
    - url: https://localhost:8443
      description: Local daemon (paths are absolute from the origin)
  security:
    - BearerAuth: []
  components:
    securitySchemes:
      BearerAuth:
        type: http
        scheme: bearer
        description: >
          Session access token from POST /api/v1/auth/login, sent as the
          seed_access cookie or an Authorization bearer, or a personal access
          token.
      CsrfToken:
        type: apiKey
        in: header
        name: X-CSRF-Token
        description: Per-session CSRF token from GET /api/v1/auth/csrf.

operations:
  GET /__version:
    summary: Build metadata (version, commit, build time, UI build hash)
    responses:
      "200":
        description: The running binary's build metadata and TLS certificate fingerprint.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildVersionResponse'
  GET /__capabilities:
    summary: Route-policy manifest of every registered route
    responses:
      "200":
        description: Every registered route's policy, in registration order.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
  POST /api/v1/auth/login:
    summary: Sign in and receive a session
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    responses:
      "200":
        description: Signed in; the session token, or an MFA challenge.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
  GET /api/v1/auth/csrf:
    summary: Mint a CSRF token for the current session
    responses:
      "200":
        description: A CSRF token bound to the session.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CSRFTokenResponse'
  POST /api/v1/auth/login/totp:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TOTPLoginRequest'
    responses:
      "200":
        description: Second factor accepted; the session token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
  POST /api/v1/auth/refresh:
    responses:
      "200":
        description: A fresh session token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
  POST /api/v1/auth/logout:
    responses:
      "200":
        description: Signed out; the session's tokens are revoked and its cookies cleared.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutResponse'
  GET /api/v1/auth/mfa/status:
    responses:
      "200":
        description: The caller's second-factor enrolment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAStatusResponse'
  POST /api/v1/auth/totp/setup:
    responses:
      "200":
        description: A new, not yet enabled TOTP secret, its provisioning URI and QR code.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPSetupResponse'
  POST /api/v1/auth/totp/verify:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TOTPVerifyRequest'
    responses:
      "200":
        description: The code matched; TOTP is now required at sign-in.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAToggleResponse'
  POST /api/v1/auth/totp/disable:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TOTPDisableRequest'
    responses:
      "200":
        description: Password and code matched; TOTP is no longer required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAToggleResponse'
  POST /api/v1/auth/webauthn/register/begin:
    responses:
      "200":
        description: Creation options for navigator.credentials.create(); enrolled passkeys are excluded.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnCreationOptionsResponse'
  POST /api/v1/auth/webauthn/register/finish:
    responses:
      "200":
        description: The attestation verified and the passkey is enrolled.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAToggleResponse'
  POST /api/v1/auth/webauthn/login/begin:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebAuthnLoginBeginRequest'
    responses:
      "200":
        description: Request options for navigator.credentials.get(), naming the account's passkeys.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRequestOptionsResponse'
  POST /api/v1/auth/webauthn/login/finish:
    responses:
      "200":
        description: The assertion verified; the session token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResponse'
  POST /api/v1/config/backup:
    responses:
      "201":
        description: The backup that was written.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupInfo'
  DELETE /api/v1/config/backup/delete:
    responses:
      "200":
        description: The backup named by the name query parameter was deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigBackupResponse'
  GET /api/v1/config/backups:
    responses:
      "200":
        description: The stored configuration backups.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupListResponse'
  POST /api/v1/config/restore:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestoreRequest'
    responses:
      "200":
        description: The configuration was restored from the named backup.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigBackupResponse'
  GET /api/v1/config/version:
    responses:
      "200":
        description: The configuration schema version.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigVersionResponse'
  GET /api/v1/device-credentials:
    responses:
      "200":
        description: The caller's client's SNMP credentials. Secrets are write-only and never returned.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCredentialListResponse'
  POST /api/v1/device-credentials:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCredentialRequest'
    responses:
      "200":
        description: The stored credential, without its secrets. Devices found without SNMP are asked again.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  GET /api/v1/device-credentials/{credentialId}:
    responses:
      "200":
        description: The credential, without its secrets.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  PUT /api/v1/device-credentials/{credentialId}:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCredentialRequest'
    responses:
      "200":
        description: The replaced credential, without its secrets.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  DELETE /api/v1/device-credentials/{credentialId}:
    responses:
      "204":
        description: The credential was deleted. A credential a polling target still references is a 409.
  GET /api/v1/discovery/bonjour:
    responses:
      "200":
        description: The Bonjour services observed during the browse window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowseResult'
  GET /api/v1/discovery/engine:
    responses:
      "200":
        description: The engine's devices and statistics from its last scan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineDiscoveryResponse'
  GET /api/v1/discovery/engine/capabilities:
    responses:
      "200":
        description: Which discovery capabilities the engine can use.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineCapabilities'
  GET /api/v1/discovery/engine/device/{mac}:
    responses:
      "200":
        description: The discovered device with that MAC address.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveredDevice'
  GET /api/v1/discovery/engine/events:
    responses:
      "200":
        description: >
          A server-sent event stream that stays open until the client
          disconnects. It opens with a `: ready` comment and sends a
          `: heartbeat` comment every 30 s. Each discovery event is one frame
          named by the event's type (`device.discovered`, `device.updated`,
          `device.lost`, `scan.started`, `scan.completed`, …) whose `data` is
          the event as JSON (`type`, `source`, `timestamp`, and `deviceMac`,
          `device`, `changes`, `payload` or `error` where they apply). A client
          that falls 64 frames behind loses frames; re-sync with
          `GET /api/v1/discovery/engine`. 503 when the engine is not running.
        content:
          text/event-stream:
            schema:
              type: string
  POST /api/v1/discovery/engine/full:
    responses:
      "200":
        description: The completed full scan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineDiscoveryResponse'
  POST /api/v1/discovery/engine/quick:
    responses:
      "200":
        description: The completed quick scan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineDiscoveryResponse'
  POST /api/v1/discovery/engine/scan:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EngineScanRequest'
    responses:
      "200":
        description: The completed scan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineDiscoveryResponse'
  GET /api/v1/discovery/engine/stats:
    responses:
      "200":
        description: Discovery engine counters.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineStats'
  GET /api/v1/engines:
    responses:
      "200":
        description: Every running background engine and its state.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnginesResponse'
  GET /api/v1/events:
    responses:
      "200":
        description: >
          The live telemetry stream (Pro), open until the client disconnects.
          Frames are unnamed; each `data` is a JSON message `{type, payload}`.
          The first is `initial_state` (interface, whether it is wireless, and
          the current card data); then `card_update`, `linkState`, `traceHop`,
          `pathMonitor`, `deviceScanComplete` and `profileChanged` as they
          happen. A `: heartbeat` comment is sent every 30 s.
        content:
          text/event-stream:
            schema:
              type: string
  GET /api/v1/flows/application-signatures:
    responses:
      "200":
        description: The signature table the collector names flows with. source is builtin for the shipped table and custom once an operator has replaced it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSignaturesResponse'
  PUT /api/v1/flows/application-signatures:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppSignaturesRequest'
    responses:
      "200":
        description: The table in effect after the replacement. Flows stored after it are named by it; stored flows keep their names. An empty table, a bad port, or a port claimed by two signatures is a 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSignaturesResponse'
  DELETE /api/v1/flows/application-signatures:
    responses:
      "200":
        description: The builtin table, now back in effect.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSignaturesResponse'
  GET /api/v1/flows/threat-indicators:
    responses:
      "200":
        description: The operator-supplied addresses and prefixes each collected flow is checked against. Seed ships no list and never fetches one.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowIndicatorsResponse'
  PUT /api/v1/flows/threat-indicators:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FlowIndicatorsRequest'
    responses:
      "200":
        description: The list in effect after the replacement, each entry in canonical form. An empty list turns matching off. Flows collected after the change are checked against it; stored flows are not re-checked.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowIndicatorsResponse'
  GET /api/v1/flows/top-applications:
    responses:
      "200":
        description: Top applications over the window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowApplicationsResponse'
  GET /api/v1/flows/top-conversations:
    responses:
      "200":
        description: Top conversations over the window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConversationsResponse'
  GET /api/v1/flows/top-talkers:
    responses:
      "200":
        description: Top talkers over the window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowTalkersResponse'
  GET /api/v1/health:
    responses:
      "200":
        description: The daemon is up; uptime in seconds.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthResponse'
  GET /api/v1/history/anomalies:
    responses:
      "200":
        description: Recorded anomalies over the window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyHistoryResponse'
  GET /api/v1/history/probes/{probeId}:
    responses:
      "200":
        description: The probe's trend over the resolved window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeHistoryResponse'
  GET /api/v1/interface:
    responses:
      "200":
        description: The selected interface, and an alternative when it is no longer available.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterfaceSelectionResponse'
  PUT /api/v1/interface:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetInterfaceRequest'
    responses:
      "200":
        description: The interface is selected; a warning says when it is down. An unknown interface answers 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInterfaceResponse'
  GET /api/v1/interfaces:
    responses:
      "200":
        description: The usable interfaces split into the Ethernet and Wi-Fi lists, with the recommended interface of each.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizedInterfacesResponse'
  GET /api/v1/ip-sla/operations:
    responses:
      "200":
        description: >
          Every Cisco IP-SLA operation the polling targets run, from each
          target's latest ip_sla poll, with its most recent run. Failed
          operations come first, then those over their threshold, then the
          healthy ones, then those that have not run.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IPSLAOperationsResponse'
  GET /api/v1/ip-sla/operations/history:
    responses:
      "200":
        description: >
          One IP-SLA operation's runs over the last 1h, 24h or 7d: per bucket,
          the share of runs that completed and the mean RTT, jitter, loss and
          MOS they measured.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IPSLAHistoryResponse'
  GET /api/v1/ipam/subnets:
    responses:
      "200":
        description: >
          The address utilization of the active interface's subnet, of
          every target network an operator has not dismissed, and of every
          DHCP scope. An address counts as in use when the last sweep found
          it or a router's ARP table held it in the last 24 hours. IPv6
          networks are not listed. A scope is near exhaustion at 90% in use
          and full with no address left; each climb raises a
          dhcp.scope.exhaustion alert.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IPAMSubnetsResponse'
  POST /api/v1/ipam/scopes:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IPAMScopeRequest'
    responses:
      "200":
        description: >
          The DHCP scope was added. A scope is two IPv4 addresses, start
          first (400 otherwise), and may not share an address with another
          scope (409).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  DELETE /api/v1/ipam/scopes:
    responses:
      "200":
        description: The DHCP scope starting at the start query parameter was removed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  POST /api/v1/jobs:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateJobRequest'
    responses:
      "201":
        description: The job was started.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResponse'
      "200":
        description: The job an earlier request with the same Idempotency-Key started.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResponse'
  GET /api/v1/jobs/events:
    responses:
      "200":
        description: >
          A server-sent event stream of every job's state changes, open until
          the client disconnects. It opens with a `: ready` comment and sends
          a `: heartbeat` comment every 30 s. Each change is one `job` frame
          whose `data` is a `JobResponse`; clients filter by `id`. A client
          that falls 64 frames behind loses frames; re-sync with
          `GET /api/v1/jobs/{jobId}`.
        content:
          text/event-stream:
            schema:
              type: string
  GET /api/v1/jobs/{jobId}:
    responses:
      "200":
        description: The job's current state.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResponse'
  DELETE /api/v1/jobs/{jobId}:
    responses:
      "202":
        description: Cancellation requested; the job's state at that moment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResponse'
  GET /api/v1/captures/{captureId}:
    responses:
      "200":
        description: >
          The pcap file a finished capture job wrote, sent as the
          seed-capture-<captureId>.pcap attachment. Range requests are honoured.
          Operator role required; an unknown capture is 404, one still being
          written 409.
        content:
          application/vnd.tcpdump.pcap:
            schema:
              type: string
              contentMediaType: application/vnd.tcpdump.pcap
  GET /api/v1/license:
    responses:
      "200":
        description: The active licence.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseStatusResponse'
  GET /api/v1/lifecycle/feed:
    responses:
      "200":
        description: >
          The opt-in EoX feed's settings and its last refresh. Choice
          unanswered means the operator has not been asked yet; the feed is
          off until an admin answers on, and off makes no outbound request.
          The client secret is never served; hasClientSecret says whether
          one is stored.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleFeedResponse'
  PUT /api/v1/lifecycle/feed:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LifecycleFeedUpdate'
    responses:
      "200":
        description: >
          The answer and settings were saved; the settings now in effect. On
          asks the Cisco EoX API about every inventoried product ID now and
          then daily, merging what it returns into the EoX data. A setting
          that could never fetch (on against Cisco without a client ID and
          secret, an endpoint that is not https) is 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleFeedResponse'
  GET /api/v1/lifecycle/devices:
    responses:
      "200":
        description: >
          Every part the last discovery inventoried over ENTITY-MIB that has
          a model name, grouped by device, with where its product stands
          today against the imported EoX data: not_listed when the data has
          no record for it, announced before the first milestone, then
          end_of_sale, end_of_sw_maintenance, end_of_security_support and
          end_of_support as each date passes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleDevicesResponse'
  GET /api/v1/lifecycle/eox:
    responses:
      "200":
        description: >
          The EoX records, imported or fetched by the opt-in feed, in product
          ID order. Seed ships none; an install with nothing imported and the
          feed off returns an empty list.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleEoXResponse'
  PUT /api/v1/lifecycle/eox:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: >
              A Cisco EoX API response as downloaded (an object with an
              EOXRecord array), or an array of them for a query that spanned
              several pages or calls.
    responses:
      "200":
        description: >
          The EoX data was replaced; the records now in effect. Records for
          product IDs Cisco has no data for are skipped, and a response with
          no records clears the data. A document that is not an EoX response,
          or carries a date that is not YYYY-MM-DD, is 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleEoXResponse'
  POST /api/v1/network/mtu:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SetMTURequest'
    responses:
      "200":
        description: The MTU is set on the named interface, or on the current one when the request names none.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMTUResponse'
  GET /api/v1/network/neighbours:
    responses:
      "200":
        description: The host's ARP and NDP neighbour cache.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NeighbourCacheResponse'
  POST /api/v1/path/path:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PathRequest'
    responses:
      "200":
        description: The discovered L2 and L3 path.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathResponse'
  POST /api/v1/path/traceroute:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TracerouteRequest'
    responses:
      "200":
        description: The traceroute result. Hop rtt is in nanoseconds; hops carry no route here.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TracerouteResult'
  GET /api/v1/alerts:
    responses:
      "200":
        description: The alert inbox, newest first. Filters are query parameters - type, severity, device_id, unacknowledged_only, unresolved_only, since (RFC3339), limit (at most 1000, default 100) and offset.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertListResponse'
  POST /api/v1/alerts/{alertId}/acknowledge:
    responses:
      "200":
        description: The alert is acknowledged by the caller.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeResponse'
  POST /api/v1/alerts/{alertId}/resolve:
    responses:
      "200":
        description: The alert is resolved.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertResolveResponse'
  GET /api/v1/alert-rules:
    responses:
      "200":
        description: Operator-defined alert rules, applied on top of the built-in rule set. enabled_only=true lists only the enabled ones. A rule with a groupId fires only for events from that device group's members.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleListResponse'
  POST /api/v1/alert-rules:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertRuleRequest'
    responses:
      "200":
        description: The created rule; Location names it. name, alertType, alertSeverity and alertTitle are required, and unknown fields are a 400. A groupId that is not one of the caller's device groups is a 400.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleResponse'
  GET /api/v1/alert-rules/{ruleId}:
    responses:
      "200":
        description: The alert rule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleResponse'
  PUT /api/v1/alert-rules/{ruleId}:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AlertRuleRequest'
    responses:
      "200":
        description: The replaced rule, read back after the write.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleResponse'
  DELETE /api/v1/alert-rules/{ruleId}:
    responses:
      "204":
        description: The rule was deleted.
  GET /api/v1/device-groups:
    responses:
      "200":
        description: The caller's client's device groups, ordered by name. Members are polling target ids.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupListResponse'
  POST /api/v1/device-groups:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceGroupRequest'
    responses:
      "201":
        description: The created group; Location names it. A member that is not one of the caller's polling targets is a 400, and a name the client already uses is a 409.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupResponse'
  GET /api/v1/device-groups/{groupId}:
    responses:
      "200":
        description: The device group.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupResponse'
  PUT /api/v1/device-groups/{groupId}:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceGroupRequest'
    responses:
      "200":
        description: The replaced group. The member list is replaced as a whole.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceGroupResponse'
  DELETE /api/v1/device-groups/{groupId}:
    responses:
      "204":
        description: The group was deleted. A group an alert rule is scoped to is a 409 until the rule is changed or deleted.
  GET /api/v1/polling-targets:
    responses:
      "200":
        description: The caller's client's SNMP polling targets.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollingTargetListResponse'
  POST /api/v1/polling-targets:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PollingTargetRequest'
    responses:
      "200":
        description: The created target; Location names it. A target past the licence's limit, or a Pro collector below Pro, is a 402.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollingTargetResponse'
  GET /api/v1/polling-targets/{targetId}:
    responses:
      "200":
        description: The polling target.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollingTargetResponse'
  PUT /api/v1/polling-targets/{targetId}:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PollingTargetRequest'
    responses:
      "200":
        description: The replaced target.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollingTargetResponse'
  DELETE /api/v1/polling-targets/{targetId}:
    responses:
      "204":
        description: The target was deleted.
  POST /api/v1/polling-targets/{targetId}/poll:
    responses:
      "200":
        description: The target after one poll run now, enabled or not; lastStatus and lastError carry the outcome. 503 when the SNMP poller is not running (below Starter, or no credential keyring).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollingTargetResponse'
  GET /api/v1/profiles:
    responses:
      "200":
        description: Every profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileListResponse'
  POST /api/v1/profiles:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileRequest'
    responses:
      "201":
        description: The created profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  GET /api/v1/profiles/active:
    responses:
      "200":
        description: The active profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  GET /api/v1/profiles/export:
    responses:
      "200":
        description: Every profile, in the import format.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileExportResponse'
  POST /api/v1/profiles/import:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileImportRequest'
    responses:
      "200":
        description: What was imported and what was skipped.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileImportResponse'
  POST /api/v1/profiles/switch:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileSwitchRequest'
    responses:
      "200":
        description: The profile that is now active; its saved settings are applied to the running configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileSwitchResponse'
  GET /api/v1/profiles/{profileId}:
    responses:
      "200":
        description: The profile. The ETag header carries its version for a later If-Match.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  PUT /api/v1/profiles/{profileId}:
    description: Replaces the profile. An If-Match header naming a stale ETag answers 412 and leaves it unchanged.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileRequest'
    responses:
      "200":
        description: The updated profile, with its new ETag.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  DELETE /api/v1/profiles/{profileId}:
    description: The default profile and the active profile cannot be deleted (400).
    responses:
      "200":
        description: The profile was deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusMessageResponse'
  POST /api/v1/profiles/{profileId}/duplicate:
    description: A second profile needs the multi-client licence feature (402).
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileDuplicateRequest'
    responses:
      "201":
        description: The copy. Without a name in the body the store names it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  PATCH /api/v1/profiles/{profileId}/settings:
    description: Replaces the settings block of the profile's config with the JSON object in the body, leaving its name, description, default flag and the rest of its config unchanged.
    responses:
      "200":
        description: The updated profile.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResponse'
  POST /api/v1/recovery/complete:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecoveryCompleteRequest'
    responses:
      "200":
        description: The password was reset.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCompleteResponse'
  GET /api/v1/recovery/instructions:
    responses:
      "200":
        description: How to recover access on this install.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryInstructionsResponse'
  GET /api/v1/recovery/status:
    responses:
      "200":
        description: Whether password recovery is available.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryStatusResponse'
  GET /api/v1/reporting/export:
    responses:
      "200":
        description: >
          The diagnostic export document, sent as the seed-export.json
          attachment. A card whose source is unavailable or has nothing to
          report is left out; ?interface= exports another interface.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportResponse'
  GET /api/v1/reporting/logs:
    responses:
      "200":
        description: The last lines of the daemon log file, 200 by default; ?lines= asks for more, up to the server cap.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogFileResponse'
  POST /api/v1/reporting/logs/client:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientLogRequest'
    responses:
      "200":
        description: The batch was accepted; received counts its entries.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLogResponse'
  GET /api/v1/reporting/logs/query:
    responses:
      "200":
        description: The matching log entries.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogQueryResponse'
  GET /api/v1/reporting/logs/recent:
    responses:
      "200":
        description: The most recent log entries, 100 by default; ?limit= asks for 1 to 1000.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogsRecentResponse'
  GET /api/v1/reporting/logs/stats:
    responses:
      "200":
        description: Log volume by level.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogStatsResponse'
  GET /api/v1/report-schedules:
    responses:
      "200":
        description: The report schedules.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportSchedulesResponse'
  POST /api/v1/report-schedules:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportScheduleRequest'
    responses:
      "201":
        description: The schedule was created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportScheduleInfo'
  GET /api/v1/report-schedules/{scheduleId}:
    responses:
      "200":
        description: The schedule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportScheduleInfo'
  PUT /api/v1/report-schedules/{scheduleId}:
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReportScheduleRequest'
    responses:
      "200":
        description: The updated schedule.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportScheduleInfo'
  DELETE /api/v1/report-schedules/{scheduleId}:
    responses:
      "204":
        description: The schedule was deleted.
  GET /api/v1/reports:
    responses:
      "200":
        description: The generated reports.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportsResponse'
  POST /api/v1/reports/generate:
    description: >
      groupId scopes a capacity report to the interfaces of one of the
      caller's device groups. With any other report type it is 400; a group
      the caller's client does not have is 404.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenerateReportRequest'
    responses:
      "202":
        description: The report that was generated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInfo'
  GET /api/v1/reports/{reportId}:
    responses:
      "200":
        description: The report record; its file is at /download once status is complete.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInfo'
  DELETE /api/v1/reports/{reportId}:
    responses:
      "204":
        description: The report and its file were deleted.
  GET /api/v1/reports/{reportId}/download:
    responses:
      "200":
        description: >
          The generated file, sent as the <reportId>.<format> attachment with
          the format's media type (PDF, HTML, CSV, JSON, XLSX or Markdown).
          An unknown report is 404, one still being generated 409.
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
  GET /api/v1/security/devices:
    responses:
      "200":
