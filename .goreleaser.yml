# =============================================================================
# goreleaser config for Seed
# =============================================================================
# Canonical release packager. Driven by .github/workflows/release.yml inside
# the goreleaser-cross container (which ships gcc + osxcross + mingw-w64).
#
# Covers natively:
#   - Multi-arch builds (linux/windows × amd64/arm64; darwin arm64 only)
#   - Archives (.tar.gz, .zip), Linux packages (.deb, .rpm) via nfpm
#   - ldflags injection (Version, Commit, BuildTime, UIBuildHash)
#   - cosign keyless signing of every artifact
#   - syft SBOM per primary archive and Linux package
#   - SHA-256 checksums
#   - release-please CHANGELOG.md as release body
#
# Handled outside goreleaser by sidecar jobs in release.yml:
#   - iperf3 binary bundled into Linux archives — pre-built by the
#     build-iperf3 matrix; goreleaser picks it up from bin/ via archive files
#   - UI frontend (npm run build) — pre-built by the build-ui job and
#     downloaded into ui/dist/ before the Go build embeds it
#   - SLSA L3 provenance — actions/attest-build-provenance@v2 reads
#     goreleaser's outputs.hashes (base64 list of artifact SHA-256s)
#     and produces a signed in-toto attestation uploaded as
#     seed-slsa-provenance.intoto.jsonl
#
# Not produced from this config:
#   - macOS .pkg installer (no native pkgbuild from Linux). macOS users get
#     the .tar.gz; deploy/macos/build-pkg.sh stays in-tree for local builds.
#
# Tested against goreleaser v2.x.
# =============================================================================

version: 2

project_name: seed

before:
  hooks:
    - go mod download
    # The UI build runs BEFORE goreleaser (in the build-ui job inside
    # release.yml). Vite writes directly to internal/api/ui/, and the
    # artifact is downloaded into the same path. Verify it's there before
    # kicking off the Go build that embeds it.
    - bash -c 'test -d internal/api/ui && test -n "$(ls -A internal/api/ui)" || (echo "internal/api/ui empty — UI build step failed or artifact missing"; exit 1)'

builds:
  - id: seed-linux
    main: ./cmd/seed
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: seed
    # libpcap is linked statically, from the archives release.yml builds just
    # before this runs. One binary is packaged as both .deb and .rpm, and this
    # container is Debian-family: linked dynamically it carried Debian's
    # `libpcap.so.0.8` SONAME, which no Fedora libpcap provides, so every rpm
    # install crash-looped on first start (#2978).
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/opt/libpcap-static/amd64/include
      - CGO_LDFLAGS=/opt/libpcap-static/amd64/lib/libpcap.a
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: &ldflags
      - -s -w
      - -X github.com/MustardSeedNetworks/seed/internal/version.Version={{.Version}}
      - -X github.com/MustardSeedNetworks/seed/internal/version.Commit={{.Commit}}
      - -X github.com/MustardSeedNetworks/seed/internal/version.BuildTime={{.CommitDate}}
      - -X github.com/MustardSeedNetworks/seed/internal/version.UIBuildHash={{.Env.UI_BUILD_HASH}}
    # Per-target cross-compile settings. goreleaser-cross has all of
    # these toolchains preinstalled; without them, building linux/arm64
    # from an amd64 host fails on cgo runtime ARM64 assembly.
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          - CGO_CFLAGS=-I/opt/libpcap-static/arm64/include
          - CGO_LDFLAGS=/opt/libpcap-static/arm64/lib/libpcap.a

  - id: seed-darwin
    main: ./cmd/seed
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: seed
    env:
      - CGO_ENABLED=1
    goos: [darwin]
    # Intel macOS (amd64) support dropped fleet-wide 2026-06-08 — Apple Silicon only.
    goarch: [arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: *ldflags
    # macOS cross-compile via osxcross (bundled in goreleaser-cross).
    # The CC paths are stable inside the container image.
    overrides:
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++

  - id: seed-windows
    main: ./cmd/seed
    mod_timestamp: "{{ .CommitTimestamp }}"
    binary: seed
    # Windows: CGO disabled (gopacket/pcap fork handles arm64 build without
    # native libpcap-windows toolchain). Matches release.yml.
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags: *ldflags

archives:
  - id: linux-archive
    ids: [seed-linux]
    name_template: "seed-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: configs
        dst: configs
      - src: internal/api/ui
        dst: ui
      # iperf3 binary, pre-built by the build-iperf3 job and downloaded into
      # bin/ before goreleaser runs. One per arch.
      - src: "bin/iperf3-linux-{{ .Arch }}"
        dst: iperf3
        info:
          mode: 0o755

  - id: darwin-archive
    ids: [seed-darwin]
    name_template: "seed-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: configs
        dst: configs
      - src: internal/api/ui
        dst: ui
      # `seed install` is systemd-only; these install the launchd daemon.
      # install.sh copies com.seed.plist from its own directory.
      - src: deploy/launchd/com.seed.plist
        dst: com.seed.plist
      - src: deploy/launchd/install.sh
        dst: install.sh
        info:
          mode: 0o755
      - src: deploy/launchd/uninstall.sh
        dst: uninstall.sh
        info:
          mode: 0o755
      - src: deploy/launchd/upgrade.sh
        dst: upgrade.sh
        info:
          mode: 0o755

  - id: windows-archive
    ids: [seed-windows]
    name_template: "seed-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: [zip]
    files:
      - src: configs
        dst: configs
      - src: internal/api/ui
        dst: ui
      - src: deploy/windows/build.ps1
        dst: install.ps1

# Linux .deb + .rpm via nfpm (built into goreleaser).
nfpms:
  - id: linux-packages
    ids: [seed-linux]
    package_name: seed
    vendor: Mustard Seed Networks
    homepage: https://github.com/MustardSeedNetworks/seed
    maintainer: Kris Armstrong <kris.armstrong@icloud.com>
    description: |
      Seed - Network Diagnostic Tool by Mustard Seed Networks
      .
      Seed is a professional-grade network diagnostic appliance designed
      for network technicians and engineers. Plug it into any network jack
      and instantly see link status, switch information, DHCP details, DNS
      health, gateway connectivity, Wi-Fi radio conditions, and
      vulnerability findings.
    license: BSL-1.1
    section: net
    priority: optional
    formats:
      - deb
      - rpm
    file_name_template: >-
      {{- if eq .ConventionalExtension ".deb" -}}
        seed_{{ .Version }}_{{ .Arch }}
      {{- else if eq .ConventionalExtension ".rpm" -}}
        {{- $rpmarch := .Arch -}}
        {{- if eq .Arch "amd64" }}{{ $rpmarch = "x86_64" }}{{ end -}}
        {{- if eq .Arch "arm64" }}{{ $rpmarch = "aarch64" }}{{ end -}}
        seed-{{ .Version }}-1.{{ $rpmarch }}
      {{- end -}}
    dependencies:
      - systemd
    overrides:
      # No libpcap on either family: it is linked into the binary (see the
      # seed-linux build), so declaring it would only add a package the binary
      # never loads. postinstall's setcap still needs libcap's tooling.
      deb:
        dependencies:
          - systemd
          - libcap2-bin
      rpm:
        dependencies:
          - systemd
          - libcap
    contents:
      - src: ./deploy/deb/seed.service
        dst: /usr/lib/systemd/system/seed.service
        file_info:
          mode: 0o644
      - dst: /etc/seed
        type: dir
        file_info:
          mode: 0o750
          owner: seed
          group: seed
      - dst: /var/lib/seed
        type: dir
        file_info:
          mode: 0o750
          owner: seed
          group: seed
      - dst: /var/lib/seed/logs
        type: dir
        file_info:
          mode: 0o750
          owner: seed
          group: seed
      - dst: /var/log/seed
        type: dir
        file_info:
          mode: 0o750
          owner: seed
          group: seed
    scripts:
      preinstall: ./deploy/nfpm/preinstall.sh
      postinstall: ./deploy/nfpm/postinstall.sh
      preremove: ./deploy/nfpm/preremove.sh
      postremove: ./deploy/nfpm/postremove.sh
    rpm:
      scripts:
        posttrans: ./deploy/nfpm/posttrans.sh
    # Default install location for the binary (overrides nfpm default of
    # /usr/local/bin). Matches existing .deb/.rpm contract.
    bindir: /usr/bin

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - id: archives-sbom
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
  - id: packages-sbom
    artifacts: package
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  # Sign all release artifacts via cosign keyless OIDC. Mirrors release.yml's
  # cosign sign-blob loop. Bundle format preserves Sigstore transparency log
  # entry.
  - cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle"
      - "${artifact}.cosign.bundle"
      - "${artifact}"
    artifacts: all
    output: true

# Homebrew tap publishing previously lived here. Removed 2026-05-18 because
# the HOMEBREW_TAP_TOKEN repo secret was never provisioned, so every release
# errored at the brew step with 403 and blocked the downstream SLSA attestation
# job (needs: [goreleaser]).
#
# There is no tap and there will not be one — owner decision, 2026-09-07. Do not
# re-add a brews: block. macOS ships as the .tar.gz above (see the header).

release:
  github:
    owner: MustardSeedNetworks
    name: seed
  # Use release-please's CHANGELOG.md section as the release body. The
  # `replace_existing_artifacts: true` lets a re-run overwrite a partial
  # earlier failure cleanly.
  replace_existing_artifacts: true
  # Releases are immutable once published, so nothing can be uploaded to one
  # afterwards (v0.234.0 through v0.257.4 shipped with no assets that way,
  # #3157). release-please creates the release as a draft, goreleaser fills
  # that draft, and release.yml publishes it only after the frozen asset matrix
  # and SLSA provenance both pass.
  use_existing_draft: true
  draft: true
  prerelease: auto
  mode: replace
  header: |
    Seed {{ .Tag }} — Network Diagnostic Tool by Mustard Seed Networks.

    See [CHANGELOG.md](https://github.com/MustardSeedNetworks/seed/blob/main/CHANGELOG.md)
    for the full release notes.

snapshot:
  version_template: "0.0.0-dryrun-{{ .ShortCommit }}"
