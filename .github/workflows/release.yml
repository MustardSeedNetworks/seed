# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Drives .goreleaser.yml inside the
# goreleaser-cross container.
#
# Publishing is reserved for pushed tags. Only a push can satisfy the
# verify-tag assertion that the commit has a successful "CI Complete" check —
# a dispatch has no pushed tag to check, and a v* tag can be created on any
# commit, so a dispatched publish would ship an unvalidated build. Every
# publishing step therefore carries `github.event_name == 'push'` in addition
# to `!inputs.dry_run`, and verify-tag refuses a dispatch that asks to publish
# rather than silently downgrading it to a snapshot.
#
# Triggers:
#   - push to a v* tag: real release — builds, signs, publishes, generates
#     SLSA L3 provenance
#   - workflow_dispatch: snapshot only, whatever dry_run says — no publish or
#     attestation upload; artifacts are signed, coverage-verified, and uploaded
#     for inspection. dry_run=false is rejected outright.
#
# Toolchain notes:
#   The goreleaser-cross Docker image ships:
#     - gcc + gcc-aarch64-linux-gnu (Linux cross)
#     - mingw-w64 (Windows cross; we use CGO_ENABLED=0 there anyway)
#     - osxcross + macOS SDK (Darwin cross)
#   Node + iperf3 are produced in separate jobs and downloaded into the
#   goreleaser workspace; the cross image is Go-focused.
#   libpcap-dev:arm64 is apt-installed at the start because the cross
#   image doesn't ship libpcap headers per target arch.
#
# Known limitation:
#   macOS .pkg installer is not produced (no native pkgbuild from Linux).
#   macOS users get the .tar.gz; deploy/macos/build-pkg.sh stays in-tree
#   for anyone who wants to assemble one locally.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Must stay true: a manual run is always snapshot-only. Publishing requires pushing a v* tag."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      # A manual dispatch has no pushed tag whose commit can be checked, and a
      # v* tag can be created on any commit, so a dispatched publish would ship
      # an unvalidated build. Publishing is restricted to push events below;
      # refuse here as well so an operator who asks for one is told, rather than
      # getting a snapshot they may mistake for a release.
      - name: Refuse a manual dispatch that asks to publish
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::A $EVENT run cannot publish: only a pushed v* tag whose commit passed 'CI Complete' may. Re-run with dry_run=true for a snapshot, or push the tag."
          exit 1

      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # iperf3 binaries — same matrix as release.yml's build-iperf3 job.
  # Built on native runners; goreleaser picks them up from bin/.
  # =========================================================================
  build-iperf3:
    name: Build iperf3 (${{ matrix.arch }})
    needs: [verify-tag]
    runs-on: ${{ matrix.runner }}
    env:
      IPERF3_VERSION: "3.21"
      # SHA-256 published with the upstream 3.21 release tarball.
      IPERF3_SHA256: "656e4405ebd620121de7ceca3eaf43a88f79ea1b857d041a6a0b1314801acdd8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Probe for build dependencies
        id: probe-build-deps
        timeout-minutes: 5
        # ubuntu-24.04 runners already ship autoconf, automake, libtool and the
        # build-essential toolchain (gcc/g++/make/dpkg-dev), so the common case
        # needs no apt at all. Reaching for a mirror anyway put an avoidable
        # network dependency — one that can stall for the whole job budget — on
        # the release path. Probe first; only shell out to apt if the image
        # actually changes underneath us.
        run: |
          missing=""
          for tool in autoconf automake libtool make gcc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -z "$missing" ]; then
            echo "build toolchain already present; skipping apt"
            exit 0
          fi
          echo "missing:$missing — installing"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      # Only reached when the probe above found the image short of a tool, so
      # the common case still touches no mirror. Delegated to the composite
      # because the wrapper this replaces could not reap the root-owned
      # apt-get it started (#1950).
      - name: Install missing build dependencies
        if: steps.probe-build-deps.outputs.needed == 'true'
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0
        timeout-minutes: 10
        with:
          packages: build-essential autoconf automake libtool

      - name: Download and build iperf3
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o iperf3.tar.gz \
            "https://github.com/esnet/iperf/releases/download/${IPERF3_VERSION}/iperf-${IPERF3_VERSION}.tar.gz"
          echo "${IPERF3_SHA256}  iperf3.tar.gz" | sha256sum -c -
          tar -xzf iperf3.tar.gz
          cd "iperf-${IPERF3_VERSION}"
          if [ ! -f configure ]; then ./bootstrap.sh || autoreconf -i; fi
          ./configure --prefix=/tmp/iperf3-install --disable-shared --enable-static-bin
          make -j"$(nproc)"
          make install
          mkdir -p ../dist
          cp /tmp/iperf3-install/bin/iperf3 ../dist/iperf3-linux-${{ matrix.arch }}
          chmod +x ../dist/iperf3-linux-${{ matrix.arch }}

      - name: Upload iperf3 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iperf3-linux-${{ matrix.arch }}
          path: dist/iperf3-linux-${{ matrix.arch }}
          retention-days: 1

  # =========================================================================
  # UI build — done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly into
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + publish — runs inside goreleaser-cross container
  # so all cross-compile toolchains are present.
  # =========================================================================
  goreleaser:
    name: goreleaser ${{ (github.event_name == 'push' && !inputs.dry_run) && '(release)' || '(snapshot)' }}
    runs-on: ubuntu-latest
    needs: [build-iperf3, build-ui]
    permissions:
      contents: write
      id-token: write # Cosign keyless OIDC
    container:
      # Pin both tag and OCI index digest so the release toolchain is immutable.
      # Keep the image current so its Multi-Arch:same libraries stay aligned
      # with ubuntu-ports; stale images break the arm64 libpcap installation.
      image: goreleaser/goreleaser-cross:v1.27.0@sha256:3ce3506ee9179c4122ba0b5dc13ab564ff259fb65f45bfad005ddd5e4a3d326d
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libpcap headers for amd64 + arm64
        timeout-minutes: 8
        # goreleaser-cross ships compilers but not libpcap headers. gopacket/pcap
        # needs pcap.h + libpcap.so (and its transitive link deps: libdbus-1-3,
        # libibverbs, …) for cgo, per target arch.
        #
        # The image is Ubuntu-based and already carries ubuntu-ports for the
        # non-amd64 architectures, so adding arm64 and installing the full
        # libpcap-dev:arm64 package pulls every arm64 link dependency from the
        # container's own (trusted) sources — no hand-written source list or
        # keyring. This only resolves cleanly when the image's baked amd64 libs
        # match ubuntu-ports (Multi-Arch:same lockstep), which is why the image
        # pin above is kept current. `apt-get update` runs strict so a future
        # drift fails loud instead of silently shipping a broken cross-build.
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64

      # Delegated to the composite, which runs timeout as root and clears any
      # apt-get that survives an attempt. The wrapper this replaces could not:
      # a killed attempt left it holding the dpkg lock for the retry to block
      # on (#1950). `update` stays on and strict, so an arch-mismatch drift
      # still fails loud rather than silently shipping a broken cross-build.
      - name: Install libpcap headers for amd64 + arm64
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@a146506fd53fe5e01fdc01892dd838c10081d183 # v1.9.0
        timeout-minutes: 10
        with:
          packages: libpcap-dev libpcap-dev:arm64

      - name: Download iperf3 artifacts (amd64 + arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: iperf3-linux-*
          path: bin/
          merge-multiple: true

      - name: Restore iperf3 executable bits
        run: chmod +x bin/iperf3-linux-*

      - name: Download UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install Syft (SBOM) inside container
        shell: bash
        env:
          SYFT_VERSION: "1.51.0"
          # SHA-256 of syft_1.51.0_linux_amd64.tar.gz from the upstream
          # syft_1.51.0_checksums.txt. Rotate this together with
          # SYFT_VERSION on upgrade. Mirrors the pinned+checksummed gitleaks
          # install pattern in ci.yml — never pipe an installer script
          # straight to a shell.
          SYFT_SHA256: "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f"
        run: |
          set -euo pipefail
          syft_dir=$(mktemp -d)
          trap 'rm -rf "$syft_dir"' EXIT
          curl -sSfL -o "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $syft_dir/syft.tar.gz" | sha256sum -c -
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          # SHA-256 of cosign-linux-amd64 from the upstream checksums file.
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      # Anything that is not a pushed, non-dry-run tag is a snapshot. See the
      # publish predicate below: the two conditions are exact complements, so
      # exactly one of these steps runs on every path through this job.
      - name: Run goreleaser (snapshot/dry-run)
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      # The publish predicate. `github.event_name == 'push'` is what ties a
      # release to the verify-tag assertion above, which only a push can satisfy.
      - name: Run goreleaser (publish)
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Verify release asset coverage
        run: go run ./cmd/verify-release-assets

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # The release verifier emits only the frozen primary asset matrix.
          # Feed that validated subject list to the provenance job so matrix
          # coverage and attestation coverage cannot drift apart.
          set -euo pipefail
          hashes=$(base64 -w0 < dist/provenance-subjects.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload dry-run artifact bundle for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party `actions/attest-build-provenance` rather than
  # the slsa-github-generator reusable workflow. The latter (v2.1.0, the
  # current latest as of 2026-05) has a known bug in its upload-assets
  # step where UNTRUSTED_PATH is passed empty, causing the secure-download
  # action to exit 1 and the `final` job to exit 27. attest-build-provenance
  # produces the same SLSA L3 in-toto attestation (signed via Sigstore
  # keyless OIDC), surfaces it on the release's GitHub Attestations panel,
  # AND attaches the bundle file to the release as a downloadable asset.
  #
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Only a real release attests: a snapshot has nothing published to attest
    # against. `!cancelled()` is kept so a cancelled upstream is distinguishable
    # from a failed one.
    if: ${{ !cancelled() && github.event_name == 'push' && !inputs.dry_run && needs.goreleaser.result == 'success' }}
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          # Pick whichever upstream ran. The unused one is empty.
          echo "${{ needs.goreleaser.outputs.hashes }}" \
            | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             seed-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             seed-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"

  publish-release:
    name: Publish verified release
    if: ${{ github.event_name == 'push' && !inputs.dry_run }}
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        run: gh release edit "$TARGET_TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
