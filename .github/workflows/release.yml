# =============================================================================
# Release (goreleaser)
# =============================================================================
# Canonical release pipeline. Drives .goreleaser.yml inside the
# goreleaser-cross container.
#
# Publishing is reserved for pushed tags. Only a push can satisfy the
# verify-tag assertion that the commit has a successful "CI Complete" check —
# a dispatch has no pushed tag to check, and a v* tag can be created on any
# commit, so a dispatched publish would ship an unvalidated build. Every
# publishing step therefore carries `github.event_name == 'push'` in addition
# to `!inputs.dry_run`, and verify-tag refuses a dispatch that asks to publish
# rather than silently downgrading it to a snapshot.
#
# Triggers:
#   - push to a v* tag: real release — builds, signs, publishes, generates
#     SLSA L3 provenance
#   - workflow_dispatch: snapshot only, whatever dry_run says — no publish or
#     attestation upload; artifacts are signed, coverage-verified, and uploaded
#     for inspection. dry_run=false is rejected outright.
#
# Toolchain notes:
#   The goreleaser-cross Docker image ships:
#     - gcc + gcc-aarch64-linux-gnu (Linux cross)
#     - mingw-w64 (Windows cross; we use CGO_ENABLED=0 there anyway)
#     - osxcross + macOS SDK (Darwin cross)
#   Node + iperf3 are produced in separate jobs and downloaded into the
#   goreleaser workspace; the cross image is Go-focused.
#   libpcap-dev:arm64 is apt-installed at the start because the cross
#   image doesn't ship libpcap headers per target arch. The Linux binaries
#   then link a static libpcap built from source here, so one artifact serves
#   both the Debian and the Red Hat family (#2978).
#
# macOS .pkg:
#   pkgbuild exists only on macOS, so the macos-pkg job builds the installer on
#   a macOS runner from the darwin archive goreleaser produced. It is Apple
#   silicon only. The daemon and the Wi-Fi helper are signed with the Developer
#   ID Application identity, the package with the Developer ID Installer
#   identity, and the package is notarized and stapled, so it installs by
#   double-click and Wi-Fi scanning works. The Wi-Fi helper is notarized and
#   stapled before it is packaged, so air-gapped installs validate offline. A
#   pushed tag, or a dispatch with sign_macos, without the signing secrets
#   fails there rather than ship an installer Gatekeeper refuses; any other
#   dispatch builds unsigned and says so. Secrets:
#   MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD (one .p12 holding both
#   identities), APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID,
#   APPLE_NOTARY_ISSUER_ID. A dispatch with sign_macos signs and
#   notarizes too, which is how the whole chain is proven without cutting a tag.
#   The release stays a draft until provenance, which needs macos-pkg, finishes.
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Must stay true: a manual run is always snapshot-only. Publishing requires pushing a v* tag."
        type: boolean
        default: true
      sign_macos:
        description: "With dry_run: sign and notarize the macOS .pkg for real (needs the signing secrets) instead of building it unsigned. Still publishes nothing."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A v* tag is enough to start a release: no ruleset restricts tag creation in
  # any fleet repo (verified 2026-08-27 — the only ruleset present is
  # merge-queue, and it targets branches). Until tag protection lands, this is
  # the gate. It refuses to build a tag whose commit never passed CI, so an
  # accidental or unauthorised tag fails here instead of producing signed,
  # published artifacts.
  #
  # The assertion is skipped for workflow_dispatch, which is the deliberate
  # dry-run path and carries no tag — but the job itself still runs and
  # succeeds, so nothing downstream is skipped.
  verify-tag:
    name: Verify tagged commit passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      # The condition is on the step, not the job. A job-level `if:` that
      # evaluated false would leave this SKIPPED, and a skipped `needs:` entry
      # skips everything downstream through the implicit success() — the whole
      # dry-run path would silently do nothing. As a step, the job still
      # reports success and dependents run normally.
      # A manual dispatch has no pushed tag whose commit can be checked, and a
      # v* tag can be created on any commit, so a dispatched publish would ship
      # an unvalidated build. Publishing is restricted to push events below;
      # refuse here as well so an operator who asks for one is told, rather than
      # getting a snapshot they may mistake for a release.
      - name: Refuse a manual dispatch that asks to publish
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "::error::A $EVENT run cannot publish: only a pushed v* tag whose commit passed 'CI Complete' may. Re-run with dry_run=true for a snapshot, or push the tag."
          exit 1

      - name: Assert CI Complete succeeded for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # index() returns 0 for a first-element match, and jq's // only fires
          # on null/false — so a match at position 0 still prints 0 and passes.
          found=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI Complete") | .conclusion] | index("success") // empty')
          if [ -z "$found" ]; then
            echo "::error::No successful 'CI Complete' check run for ${GITHUB_SHA}. Refusing to release an unvalidated commit."
            exit 1
          fi
          echo "CI Complete succeeded for ${GITHUB_SHA}"

  # =========================================================================
  # iperf3 binaries — same matrix as release.yml's build-iperf3 job.
  # Built on native runners; goreleaser picks them up from bin/.
  # =========================================================================
  build-iperf3:
    name: Build iperf3 (${{ matrix.arch }})
    needs: [verify-tag]
    runs-on: ${{ matrix.runner }}
    env:
      IPERF3_VERSION: "3.21"
      # SHA-256 published with the upstream 3.21 release tarball.
      IPERF3_SHA256: "656e4405ebd620121de7ceca3eaf43a88f79ea1b857d041a6a0b1314801acdd8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Probe for build dependencies
        id: probe-build-deps
        timeout-minutes: 5
        # ubuntu-24.04 runners already ship autoconf, automake, libtool and the
        # build-essential toolchain (gcc/g++/make/dpkg-dev), so the common case
        # needs no apt at all. Reaching for a mirror anyway put an avoidable
        # network dependency — one that can stall for the whole job budget — on
        # the release path. Probe first; only shell out to apt if the image
        # actually changes underneath us.
        run: |
          missing=""
          for tool in autoconf automake libtool make gcc; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -z "$missing" ]; then
            echo "build toolchain already present; skipping apt"
            exit 0
          fi
          echo "missing:$missing — installing"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      # Only reached when the probe above found the image short of a tool, so
      # the common case still touches no mirror. Delegated to the composite
      # because the wrapper this replaces could not reap the root-owned
      # apt-get it started (#1950).
      - name: Install missing build dependencies
        if: steps.probe-build-deps.outputs.needed == 'true'
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        timeout-minutes: 10
        with:
          packages: build-essential autoconf automake libtool

      - name: Download and build iperf3
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o iperf3.tar.gz \
            "https://github.com/esnet/iperf/releases/download/${IPERF3_VERSION}/iperf-${IPERF3_VERSION}.tar.gz"
          echo "${IPERF3_SHA256}  iperf3.tar.gz" | sha256sum -c -
          tar -xzf iperf3.tar.gz
          cd "iperf-${IPERF3_VERSION}"
          if [ ! -f configure ]; then ./bootstrap.sh || autoreconf -i; fi
          ./configure --prefix=/tmp/iperf3-install --disable-shared --enable-static-bin
          make -j"$(nproc)"
          make install
          mkdir -p ../dist
          cp /tmp/iperf3-install/bin/iperf3 ../dist/iperf3-linux-${{ matrix.arch }}
          chmod +x ../dist/iperf3-linux-${{ matrix.arch }}

      - name: Upload iperf3 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iperf3-linux-${{ matrix.arch }}
          path: dist/iperf3-linux-${{ matrix.arch }}
          retention-days: 1

  # =========================================================================
  # UI build — done outside the goreleaser-cross container because that
  # image is Go-focused and doesn't ship Node. Vite writes directly into
  # internal/api/ui/; the next job inherits the workspace.
  # =========================================================================
  build-ui:
    name: Build UI
    needs: [verify-tag]
    runs-on: ubuntu-latest
    outputs:
      ui_hash: ${{ steps.ui-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # The Node/npm pin lives in the composite action, same as ci.yml, so
        # the release path cannot drift from what CI tested against.
        uses: ./.github/actions/setup-node
        with:
          # No npm cache on the release path. This job's output is published
          # and attested, so a poisoned cache entry restored from a branch
          # would land in a signed artifact. CI keeps its cache; releases
          # always resolve from the registry.
          cache: ""

      - name: Build UI
        run: |
          cd ui
          npm ci
          npm run build

      - name: Compute UI build hash
        id: ui-hash
        run: |
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "hash=$UI_BUILD_HASH" >> "$GITHUB_OUTPUT"

      - name: Upload UI dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: internal/api/ui/
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # goreleaser build + publish — runs inside goreleaser-cross container
  # so all cross-compile toolchains are present.
  # =========================================================================
  goreleaser:
    name: goreleaser ${{ (github.event_name == 'push' && !inputs.dry_run) && '(release)' || '(snapshot)' }}
    runs-on: ubuntu-latest
    needs: [build-iperf3, build-ui]
    permissions:
      contents: write
      id-token: write # Cosign keyless OIDC
    container:
      # Pin both tag and OCI index digest so the release toolchain is immutable.
      # Keep the image current so its Multi-Arch:same libraries stay aligned
      # with ubuntu-ports; stale images break the arm64 libpcap installation.
      image: goreleaser/goreleaser-cross:v1.27.3-3-v2.20.2@sha256:74447bcb1afe2472293568c1226ba3460f0e2db9f023d288d60cc72ffa92ee1b
    outputs:
      # base64-encoded SHA-256 hashes of all release artifacts, formatted
      # for slsa-github-generator's base64-subjects input. Set only on a
      # real (non-snapshot) release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install libpcap headers for amd64 + arm64
        timeout-minutes: 8
        # goreleaser-cross ships compilers but not libpcap headers. gopacket/pcap
        # needs pcap.h + libpcap.so (and its transitive link deps: libdbus-1-3,
        # libibverbs, …) for cgo, per target arch.
        #
        # The image is Ubuntu-based and already carries ubuntu-ports for the
        # non-amd64 architectures, so adding arm64 and installing the full
        # libpcap-dev:arm64 package pulls every arm64 link dependency from the
        # container's own (trusted) sources — no hand-written source list or
        # keyring. This only resolves cleanly when the image's baked amd64 libs
        # match ubuntu-ports (Multi-Arch:same lockstep), which is why the image
        # pin above is kept current. `apt-get update` runs strict so a future
        # drift fails loud instead of silently shipping a broken cross-build.
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture arm64

      # Delegated to the composite, which runs timeout as root and clears any
      # apt-get that survives an attempt. The wrapper this replaces could not:
      # a killed attempt left it holding the dpkg lock for the retry to block
      # on (#1950). `update` stays on and strict, so an arch-mismatch drift
      # still fails loud rather than silently shipping a broken cross-build.
      - name: Install libpcap headers for amd64 + arm64
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
        timeout-minutes: 10
        with:
          packages: libpcap-dev libpcap-dev:arm64 flex bison

      - name: Build a static libpcap for amd64 + arm64
        timeout-minutes: 15
        # Container run steps default to `sh` (dash); the script needs bash.
        shell: bash
        # One cgo binary is built here and packaged as both .deb and .rpm, so it
        # links libpcap statically and needs libc alone (#2978); the reasons and
        # the pinned source are in the script. The apt libpcap above still
        # provides the arm64 sysroot; only the link changes.
        run: |
          ./scripts/build-static-libpcap.sh /opt/libpcap-static/amd64
          ./scripts/build-static-libpcap.sh /opt/libpcap-static/arm64 \
            --host=aarch64-linux-gnu CC=aarch64-linux-gnu-gcc

      - name: Download iperf3 artifacts (amd64 + arm64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: iperf3-linux-*
          path: bin/
          merge-multiple: true

      - name: Restore iperf3 executable bits
        run: chmod +x bin/iperf3-linux-*

      - name: Download UI dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: internal/api/ui/

      - name: Install Syft (SBOM) inside container
        shell: bash
        env:
          SYFT_VERSION: "1.51.0"
          # SHA-256 of syft_1.51.0_linux_amd64.tar.gz from the upstream
          # syft_1.51.0_checksums.txt. Rotate this together with
          # SYFT_VERSION on upgrade. Mirrors the pinned+checksummed gitleaks
          # install pattern in ci.yml — never pipe an installer script
          # straight to a shell.
          SYFT_SHA256: "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f"
        run: |
          set -euo pipefail
          syft_dir=$(mktemp -d)
          trap 'rm -rf "$syft_dir"' EXIT
          curl -sSfL -o "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $syft_dir/syft.tar.gz" | sha256sum -c -
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Install Cosign inside container
        shell: bash
        env:
          COSIGN_VERSION: "v3.1.3"
          # SHA-256 of cosign-linux-amd64 from the upstream checksums file.
          COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
        run: |
          set -euo pipefail
          cosign_dir=$(mktemp -d)
          trap 'rm -rf "$cosign_dir"' EXIT
          curl -sSfL -o "$cosign_dir/cosign-linux-amd64" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $cosign_dir/cosign-linux-amd64" | sha256sum -c -
          install -m 0755 "$cosign_dir/cosign-linux-amd64" /usr/local/bin/cosign

      # Anything that is not a pushed, non-dry-run tag is a snapshot. See the
      # publish predicate below: the two conditions are exact complements, so
      # exactly one of these steps runs on every path through this job.
      - name: Run goreleaser (snapshot/dry-run)
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --snapshot --clean --skip=publish,announce

      # The publish predicate. `github.event_name == 'push'` is what ties a
      # release to the verify-tag assertion above, which only a push can satisfy.
      - name: Run goreleaser (publish)
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        env:
          UI_BUILD_HASH: ${{ needs.build-ui.outputs.ui_hash }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Verify release asset coverage
        run: go run ./cmd/verify-release-assets

      - name: Capture artifact hashes for SLSA provenance
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        run: |
          # The release verifier emits only the frozen primary asset matrix.
          # Feed that validated subject list to the provenance job so matrix
          # coverage and attestation coverage cannot drift apart.
          set -euo pipefail
          hashes=$(base64 -w0 < dist/provenance-subjects.txt)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Hand the darwin archive and checksums to macos-pkg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-inputs
          path: |
            dist/seed-*-darwin-arm64.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload dry-run artifact bundle for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dryrun-${{ github.run_id }}
          path: dist/
          retention-days: 14

  # =========================================================================
  # macOS .pkg — built from goreleaser's darwin archive, so the installer
  # carries the same binary the archive does. It is Developer ID signed,
  # notarized and stapled first; on a real release it is then SBOM'd and
  # cosign-signed like every other artifact (after stapling, which changes the
  # bytes), appended to checksums.txt (which is re-signed), and added to the
  # provenance subjects. The release is still a draft here; publish-release
  # flips it after provenance.
  # =========================================================================
  macos-pkg:
    name: macOS .pkg
    needs: [goreleaser]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # cosign keyless OIDC
    outputs:
      # base64 of goreleaser's provenance subjects plus the .pkg, the
      # subject-checksums input of the provenance job. Set only on a release.
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the darwin archive and checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-pkg-inputs
          path: ${{ runner.temp }}/macos-pkg-inputs/

      - name: Resolve the signing mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ] || [ "${SIGN_MACOS}" = "true" ]; then
            if [ -z "${P12_BASE64}" ] || [ -z "${P12_PASSWORD}" ] || [ -z "${NOTARY_KEY_BASE64}" ] || [ -z "${NOTARY_KEY_ID}" ] || [ -z "${NOTARY_ISSUER_ID}" ]; then
              echo "::error::The macOS signing secrets (MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD, APPLE_NOTARY_KEY_P8_BASE64, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID) are not all set. Without them the .pkg would be refused by Gatekeeper and carry no Wi-Fi helper, so this run is refused."
              exit 1
            fi
            echo "SIGN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sign_macos is off, so the .pkg is built UNSIGNED, UN-NOTARIZED and WITHOUT the Wi-Fi helper. It proves nothing about signing and must not be distributed."
            echo "SIGN=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Go for the Wi-Fi helper
        if: ${{ env.SIGN == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Import signing identities
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "::add-mask::${keychain_password}"
          # Registered before the key material exists, so the keychain is
          # removed even when the import below fails half way.
          echo "KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          echo "${P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "${RUNNER_TEMP}/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          security find-identity -v "${keychain}" | grep -F "Developer ID Application"
          security find-identity -v "${keychain}" | grep -F "Developer ID Installer"

      - name: Build the .pkg
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          archives=("${RUNNER_TEMP}"/macos-pkg-inputs/seed-*-darwin-arm64.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected one darwin archive, found ${#archives[@]}"
            exit 1
          fi
          name="$(basename "${archives[0]}" .tar.gz)"
          version="${name#seed-}"
          version="${version%-darwin-arm64}"
          mkdir "${RUNNER_TEMP}/darwin"
          tar -xzf "${archives[0]}" -C "${RUNNER_TEMP}/darwin" seed
          if [ "${SIGN}" = "true" ]; then
            # build-pkg.sh signs the daemon (hardened runtime, secure
            # timestamp), build-helper.sh signs the entitled Wi-Fi helper and
            # build-pkg.sh notarizes and staples it, and productbuild signs
            # the package with the Installer identity.
            export SEED_SIGN_IDENTITY="Developer ID Application"
            export SEED_INSTALLER_IDENTITY="Developer ID Installer"
          else
            export SEED_SKIP_WIFI_HELPER=1
            unset NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID
          fi
          deploy/macos/build-pkg.sh "${RUNNER_TEMP}/darwin/seed" "${version}"
          echo "PKG=seed-${version}-darwin-arm64.pkg" >> "$GITHUB_ENV"

      - name: Check the signed package contract
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          expanded="${RUNNER_TEMP}/pkg-expanded"
          pkgutil --check-signature "dist/${PKG}" | grep -F "Developer ID Installer"
          pkgutil --expand-full "dist/${PKG}" "${expanded}"
          # The Wi-Fi helper is what makes macOS scans return networks.
          pkgutil --payload-files "dist/${PKG}" | grep -Fx "./Library/Application Support/Seed/Seed Wi-Fi Helper.app"
          helper="$(find "${expanded}" -type d -name 'Seed Wi-Fi Helper.app')"
          test "$(echo "${helper}" | wc -l)" -eq 1
          codesign --verify --deep --strict "${helper}"
          xcrun stapler validate "${helper}"
          codesign -dvv "${helper}" 2>&1 | grep -F "Authority=Developer ID Application"
          codesign -d --entitlements - "${helper}" 2>&1 | grep -F "com.apple.security.personal-information.location"
          daemon="$(find "${expanded}" -type f -path '*/usr/local/seed/seed')"
          test "$(echo "${daemon}" | wc -l)" -eq 1
          codesign --verify --strict "${daemon}"
          codesign -dvv "${daemon}" 2>&1 | grep -F "Authority=Developer ID Application"
          codesign -dvv "${daemon}" 2>&1 | grep -F "flags=0x10000(runtime)"
          lipo -archs "${daemon}" | grep -Fx arm64

      - name: Notarize and staple the .pkg
        if: ${{ env.SIGN == 'true' }}
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/notary.p8"
          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "${key}"
          trap 'rm -f "${key}"' EXIT
          # notarytool exits 0 for an Invalid submission, so read the verdict.
          xcrun notarytool submit "dist/${PKG}" --key "${key}" --key-id "${NOTARY_KEY_ID}" \
            --issuer "${NOTARY_ISSUER_ID}" --wait --output-format json > "${RUNNER_TEMP}/notary.json"
          cat "${RUNNER_TEMP}/notary.json"
          if [ "$(jq -r .status "${RUNNER_TEMP}/notary.json")" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "${RUNNER_TEMP}/notary.json")" --key "${key}" \
              --key-id "${NOTARY_KEY_ID}" --issuer "${NOTARY_ISSUER_ID}" || true
            echo "::error::notarization was not Accepted"
            exit 1
          fi
          # Stapling rewrites the package, so it runs before the SBOM, the
          # signatures and the checksum are taken.
          xcrun stapler staple "dist/${PKG}"
          xcrun stapler validate "dist/${PKG}"
          spctl --assess --type install --verbose=2 "dist/${PKG}"
          pkgutil --check-signature "dist/${PKG}"

      - name: Remove the signing keychain
        if: ${{ always() && env.SIGN == 'true' }}
        shell: bash
        run: security delete-keychain "${KEYCHAIN:-${RUNNER_TEMP}/signing.keychain-db}" || true

      - name: Upload dry-run .pkg for inspection
        if: ${{ github.event_name != 'push' || inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg-dryrun-${{ github.run_id }}
          path: dist/${{ env.PKG }}
          if-no-files-found: error
          retention-days: 14

      - name: Install Syft and Cosign
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        # The linux copies of these pins are in the goreleaser job; the release
        # workflow contract fails when the two sets of versions differ. Each
        # darwin arm64 build is checked against the upstream checksums file.
        # Rotate with the linux pins.
        env:
          SYFT_DARWIN_VERSION: "1.51.0"
          SYFT_DARWIN_SHA256: "4f37f4c7fefce0a68e4cf71ba3f5f9829a99e65d89b29f7ee41b8c2c10ea8c59"
          COSIGN_DARWIN_VERSION: "v3.1.3"
          COSIGN_DARWIN_SHA256: "5cf948c2f4dfe59687bdd0b8523709067383e03982cc543475c8a7dc70e92a76"
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl -sSfL -o "${RUNNER_TEMP}/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_DARWIN_VERSION}/syft_${SYFT_DARWIN_VERSION}_darwin_arm64.tar.gz"
          echo "${SYFT_DARWIN_SHA256}  ${RUNNER_TEMP}/syft.tar.gz" | shasum -a 256 -c -
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${bin}" syft
          curl -sSfL -o "${bin}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_DARWIN_VERSION}/cosign-darwin-arm64"
          echo "${COSIGN_DARWIN_SHA256}  ${bin}/cosign" | shasum -a 256 -c -
          chmod 0755 "${bin}/syft" "${bin}/cosign"
          echo "${bin}" >> "$GITHUB_PATH"

      - name: SBOM, sign, and publish the .pkg
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          cp "${RUNNER_TEMP}/macos-pkg-inputs/checksums.txt" checksums.txt
          SYFT_FILE_METADATA_CATALOGER_ENABLED=true \
            syft "${PKG}" --output "spdx-json=${PKG}.sbom.json"
          cosign sign-blob --yes --bundle "${PKG}.cosign.bundle" "${PKG}"
          cosign sign-blob --yes --bundle "${PKG}.sbom.json.cosign.bundle" "${PKG}.sbom.json"
          shasum -a 256 "${PKG}" "${PKG}.sbom.json" >> checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt
          gh release upload "${REF_NAME}" --clobber --repo "${GITHUB_REPOSITORY}" \
            checksums.txt checksums.txt.cosign.bundle \
            "${PKG}" "${PKG}.sbom.json" "${PKG}.cosign.bundle" "${PKG}.sbom.json.cosign.bundle"

      - name: Add the .pkg to the provenance subjects
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        id: hashes
        shell: bash
        env:
          GORELEASER_HASHES: ${{ needs.goreleaser.outputs.hashes }}
        run: |
          # "<sha256>  <filename>" lines, the subject-checksums format:
          # goreleaser's validated primary assets, then the .pkg.
          set -euo pipefail
          printf '%s' "${GORELEASER_HASHES}" | base64 --decode > subjects.txt
          (cd dist && shasum -a 256 "${PKG}") >> subjects.txt
          echo "hashes=$(base64 < subjects.txt | tr -d '\n')" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # SLSA L3 provenance — runs on real releases (not dry-run).
  #
  # Uses GitHub's first-party `actions/attest-build-provenance` rather than
  # the slsa-github-generator reusable workflow. The latter (v2.1.0, the
  # current latest as of 2026-05) has a known bug in its upload-assets
  # step where UNTRUSTED_PATH is passed empty, causing the secure-download
  # action to exit 1 and the `final` job to exit 27. attest-build-provenance
  # produces the same SLSA L3 in-toto attestation (signed via Sigstore
  # keyless OIDC), surfaces it on the release's GitHub Attestations panel,
  # AND attaches the bundle file to the release as a downloadable asset.
  #
  # =========================================================================
  provenance:
    name: SLSA provenance
    # Only a real release attests: a snapshot has nothing published to attest
    # against. `!cancelled()` is kept so a cancelled upstream is distinguishable
    # from a failed one.
    if: ${{ !cancelled() && github.event_name == 'push' && !inputs.dry_run && needs.goreleaser.result == 'success' && needs.macos-pkg.result == 'success' }}
    needs: [goreleaser, macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # Sigstore OIDC signing
      contents: write       # uploading the bundle to the release
      attestations: write   # GitHub Attestations API
    steps:
      - name: Decode artifact subjects
        id: subjects
        shell: bash
        env:
          HASHES: ${{ needs.macos-pkg.outputs.hashes }}
        run: |
          set -euo pipefail
          # goreleaser's primary assets plus the macOS .pkg.
          printf '%s' "${HASHES}" | base64 -d > subjects.txt
          echo "Subjects:"
          cat subjects.txt

      - name: Generate SLSA build-provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attach attestation bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" \
             seed-slsa-provenance.intoto.jsonl
          gh release upload "$TARGET_TAG" \
             seed-slsa-provenance.intoto.jsonl --clobber --repo "${GITHUB_REPOSITORY}"

  publish-release:
    name: Publish verified release
    if: ${{ github.event_name == 'push' && !inputs.dry_run }}
    needs: [goreleaser, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.ref_name }}
        run: gh release edit "$TARGET_TAG" --draft=false --repo "${GITHUB_REPOSITORY}"
