name: PR Hygiene

# Title, body and label rules for PRs and issues, in one workflow. They were
# three (Title Lint, PR Body Lint, Auto-Labeler), each starting its own run for
# the same event: almost half of this repo's Actions runs. One job per rule, so
# a failure still names its rule, and the job names are the required check
# contexts (`Lint PR Title`, `Lint PR Body`) -- renaming a job wedges the queue.

on:
  issues:
    types: [opened, edited]
  # pull_request, not pull_request_target: these jobs read the PR and set a
  # check conclusion or labels. pull_request_target would hand a write-capable
  # token to fork PRs. (zizmor dangerous-triggers)
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Required for the merge queue: both lint jobs are required status checks.
  # Without this trigger they never report on merge_group and every queued PR
  # waits forever.
  merge_group:

permissions: {}

jobs:
  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    # Runs on merge_group too so the required check reports; there is no PR
    # title to validate there, so the step below no-ops and the job succeeds.
    # Same shape as lint-pr-body.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false
          subjectPattern: ^[a-z0-9].{2,}$
          subjectPatternError: The subject must start lowercase or with a number and be at least 3 characters.
          ignoreLabels: |
            dependencies

  lint-issue-title:
    name: Lint Issue Title
    runs-on: ubuntu-latest
    # Bots are exempt, for the same reason lint-pr-body exempts them: Renovate
    # owns the Dependency Dashboard issue and re-edits it constantly, and its
    # title is fixed by Renovate rather than by us. Without this the job fails
    # on every edit and main carries a permanent red that means nothing.
    if: >-
      github.event_name == 'issues'
      && github.event.issue.user.type != 'Bot'
    permissions:
      issues: write
    steps:
      - name: Check issue title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.issue.title || "";
            // Two conventions were in tension and both express the same thing: a
            // category plus a specific subject. Commits and PRs use
            // conventional-commit prefixes, so requiring `Feature:` here
            // flagged `feat(dhcp): force DHCP lease renewal` for being the
            // house style everywhere else.
            const valid =
              /^((Defect|Feature|Chore|Docs|Security|Epic)|(feat|fix|chore|docs|refactor|perf|test|ci|build|style|revert|security)(\([a-z0-9._\/-]+\))?!?):\s\S.{2,}$/;
            const placeholder = /^\[(BUG|FEATURE|CHORE|DOCS|SECURITY|EPIC)\]\s*$/i;
            const label = "status: needs-info";
            const flagged = (context.payload.issue.labels || []).some(
              (l) => (l.name || l) === label,
            );

            if (!valid.test(title) || placeholder.test(title)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: [label],
              });
              core.setFailed("Issue titles need a category and a specific subject: either 'Defect:', 'Feature:', 'Chore:', 'Docs:', 'Security:', 'Epic:', or a conventional-commit prefix such as 'feat(scope):'.");
              return;
            }

            // The label used to be write-only -- nothing ever removed it, so a
            // corrected title stayed flagged for good and the count could only
            // grow. Clearing it here is what makes the label mean something.
            if (flagged) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                name: label,
              });
            }

  lint-pr-body:
    name: Lint PR Body
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR body
        # Bot PRs (release-please, Renovate, Dependabot) carry auto-generated
        # bodies, not the human change-PR template — no single linked issue and
        # no code delta to describe. Validating them against it is a category
        # error, and because this is a *required* check it does not just annoy:
        # it silently parks every dependency update instead of merging it.
        # Their integrity comes from the CI Complete gate, which still runs.
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.user.type != 'Bot'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const errors = [];
            // Headings are matched on their own line. `includes` would accept a
            // heading that only appears inside a fenced code block, which is a
            // description of a PR body rather than one.
            const requiredHeadings = ["## Summary", "## Linked Issue", "## Testing Evidence", "## Security and Release Checklist"];
            for (const heading of requiredHeadings) {
              if (!new RegExp(`^${heading}\\s*$`, "m").test(body)) errors.push(`Missing ${heading}`);
            }
            if (!/(Fixes|Closes|Resolves|Related to)\s+#\d+/i.test(body)) {
              errors.push("Link the tracked issue with Fixes #123, Closes #123, Resolves #123, or Related to #123.");
            }
            // Slice the section on line-anchored level-2 headings. Splitting on
            // a bare "## " matched it anywhere, including inside a fenced block:
            // an evidence block containing "### RED" was cut mid-fence, so the
            // regex below saw an unterminated code block and reported missing
            // evidence on a PR that had two full command transcripts.
            const afterHeading = body.split(/^## Testing Evidence\s*$/m)[1] ?? "";
            const testing = afterHeading.split(/^## /m)[0];
            if (!/```[\s\S]*\S[\s\S]*```/.test(testing) && !/not run/i.test(testing)) {
              errors.push("Testing Evidence must include command output or an explicit not-run reason.");
            }
            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            }
      - name: Merge queue placeholder
        if: github.event_name == 'merge_group'
        run: echo "PR body lint is satisfied for merge queue batches."

  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    # `edited` and `ready_for_review` change no files, so they relabel nothing.
    if: >-
      github.event_name == 'pull_request'
      && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"

  label-issue:
    name: Label Issue
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    permissions:
      issues: write
    steps:
      - name: Parse issue and apply labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const labelsToAdd = [];

            // Component mapping from form dropdown
            const componentMap = {
              'API/Backend': 'component: api',
              'UI/Frontend': 'component: ui',
              'Network Discovery': 'component: discovery',
              'WiFi Survey': 'component: wifi',
              'Speed Test / iPerf': 'component: iperf',
              'DHCP Detection': 'component: dhcp',
              'Authentication': 'component: auth',
              'Configuration': 'component: config',
              'Installation/Deployment': 'area: build',
              'Documentation': 'area: docs',
              'CI/CD Pipeline': 'area: ci',
            };

            // Priority mapping
            const priorityMap = {
              'Critical': 'priority: critical',
              'High': 'priority: high',
              'Medium': 'priority: medium',
              'Low': 'priority: low',
              'Nice to have': 'priority: low',
              'Would improve my workflow': 'priority: medium',
              'Important for my use case': 'priority: high',
              'Critical - blocking my use': 'priority: critical',
            };

            // Severity mapping (for bugs)
            const severityMap = {
              'Critical - App crashes or data loss': 'priority: critical',
              'High - Major feature broken': 'priority: high',
              'Medium - Feature partially broken': 'priority: medium',
              'Low - Minor issue or cosmetic': 'priority: low',
            };

            // Check for component in body
            for (const [key, label] of Object.entries(componentMap)) {
              if (body.includes(key)) {
                labelsToAdd.push(label);
                break;
              }
            }

            // Check for priority/severity in body
            for (const [key, label] of Object.entries({...priorityMap, ...severityMap})) {
              if (body.includes(key)) {
                labelsToAdd.push(label);
                break;
              }
            }

            // Apply labels if any were found
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
              console.log(`Added labels: ${labelsToAdd.join(', ')}`);
            }
