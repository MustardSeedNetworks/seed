# NIAC pack acceptance — seed's collectors, topology and alert pipeline
# against NIAC's six presentation packs (niac plan P3-3, ledger M5-5).
#
# scripts/snmp-acceptance-niac.sh runs each pack in a network namespace and
# polls it from a second one over a veth pair, then compares what seed saw with
# the manifest NIAC generated alongside the pack. Nightly against the latest
# NIAC release, so a regression on either side shows up within a day; on a PR
# only when the harness itself changes, since it takes about a quarter of an
# hour and adds nothing to an unrelated change.
name: NIAC Packs

on:
  schedule:
    # 05:23 UTC: after SNMP Integration, off the hour.
    - cron: '23 5 * * *'
  pull_request:
    paths:
      - .github/workflows/niac-packs.yml
      - scripts/snmp-acceptance-niac.sh
      - internal/polling/snmp/orchestrator/pack_acceptance_niac_test.go
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niac-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packs:
    name: Six packs against the latest NIAC release
    runs-on: ubuntu-latest
    # The budget: about 11 minutes on dev-srv-ubuntu (2026-10-04), most of it
    # the per-pack neighbour settling and fault timing the manifests set.
    timeout-minutes: 30
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev and PyYAML
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        timeout-minutes: 10
        with:
          packages: libpcap-dev python3-yaml

      # The release tarball, not a source build: the harness accepts what an
      # operator installs. checksums.txt is verified against the archive so a
      # truncated or swapped download fails here, not as a confusing finding.
      - name: Install the latest NIAC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/niac"
          mkdir -p "$dir/bin"
          tag=$(gh release view --repo MustardSeedNetworks/niac-go --json tagName --jq .tagName)
          version=${tag#v}
          gh release download "$tag" --repo MustardSeedNetworks/niac-go --dir "$dir" \
            --pattern "niac-$version-linux-amd64.tar.gz" --pattern checksums.txt
          (cd "$dir" && sha256sum --check --ignore-missing --strict checksums.txt)
          tar -xzf "$dir/niac-$version-linux-amd64.tar.gz" -C "$dir/bin" niac
          echo "$dir/bin" >>"$GITHUB_PATH"
          "$dir/bin/niac" --version

      - name: Run the pack acceptance
        timeout-minutes: 25
        run: ./scripts/snmp-acceptance-niac.sh

      - name: Harness logs
        if: failure()
        run: |
          for f in "${TMPDIR:-/tmp}"/seed-snmp-acceptance-logs.*/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
