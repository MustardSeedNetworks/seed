name: Title Lint

on:
  issues:
    types: [opened, edited]
  # pull_request, not pull_request_target: this job only reads the PR title
  # and sets a check conclusion, so the fork-PR read-only token is sufficient.
  # pull_request_target would hand a write-capable token to a workflow that
  # never needs one. (zizmor dangerous-triggers)
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  # Required for the merge queue: `Lint PR Title` is a required status check.
  # Without this trigger the workflow never fires on merge_group, the check
  # never reports, and every queued PR waits forever.
  merge_group:

permissions: {}

jobs:
  lint-pr-title:
    name: Lint PR Title
    runs-on: ubuntu-latest
    # Runs on merge_group too so the required check reports; there is no PR
    # title to validate there, so the step below no-ops and the job succeeds.
    # Same shape as pr-body-lint. Issues keep their own separate job.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test
          requireScope: false
          subjectPattern: ^[a-z0-9].{2,}$
          subjectPatternError: The subject must start lowercase or with a number and be at least 3 characters.
          ignoreLabels: |
            dependencies

  lint-issue-title:
    name: Lint Issue Title
    runs-on: ubuntu-latest
    # Bots are exempt, for the same reason pr-body-lint exempts them: Renovate
    # owns the Dependency Dashboard issue and re-edits it constantly, and its
    # title is fixed by Renovate rather than by us. Without this the job fails
    # on every edit and main carries a permanent red that means nothing.
    if: >-
      github.event_name == 'issues'
      && github.event.issue.user.type != 'Bot'
    permissions:
      issues: write
    steps:
      - name: Check issue title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.issue.title || "";
            const valid = /^(Defect|Feature|Chore|Docs|Security|Epic):\s\S.{2,}$/;
            const placeholder = /^\[(BUG|FEATURE|CHORE|DOCS|SECURITY|EPIC)\]\s*$/i;
            if (!valid.test(title) || placeholder.test(title)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ["status: needs-info"],
              });
              core.setFailed("Issue titles must use 'Defect:', 'Feature:', 'Chore:', 'Docs:', 'Security:', or 'Epic:' followed by a specific subject.");
            }
