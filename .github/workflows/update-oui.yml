# =============================================================================
# Refresh Embedded IEEE OUI Database
# =============================================================================
# The MAC -> vendor lookup baseline is the IEEE OUI registry embedded into the
# binary at internal/discovery/resolve/oui.txt (via //go:embed). It is the single
# source of truth and goes stale at build time, so this workflow keeps it current:
#
#   1. Download the latest oui.txt from the official IEEE source.
#   2. Sanity-check it (size + format) so we never embed an error page.
#   3. If it changed, validate it builds + the resolve tests pass, then open a PR.
#
# It opens a PR (not a direct push to main) so the data change stays reviewed,
# version-controlled, and reproducible. Runs monthly + on demand.
#
# The branch push and the PR are authored by the msn-ci-bot App, not by
# GITHUB_TOKEN, for two reasons. The org forbids Actions from creating pull
# requests, so `gh pr create` under GITHUB_TOKEN fails outright with "GitHub
# Actions is not permitted to create or approve pull requests" -- that is what
# broke the 2026-09-01 run, which pushed its branch and then died with no PR
# and nothing watching. An App installation token is not subject to that
# restriction. Second, GITHUB_TOKEN-authored refs do not trigger workflows, so
# even a successful create would have produced a refresh PR with no CI on it.
# =============================================================================

name: Refresh OUI Database

on:
  schedule:
    # Monthly, 06:00 UTC on the 1st
    - cron: '0 6 1 * *'
  workflow_dispatch:

# Nothing here uses GITHUB_TOKEN: the App token carries the write access, and
# it is scoped by the mint step rather than by this block.
permissions: {}

concurrency:
  group: update-oui
  cancel-in-progress: false

env:
  OUI_PATH: internal/discovery/resolve/oui.txt
  OUI_URL: https://standards-oui.ieee.org/oui/oui.txt

jobs:
  refresh-oui:
    name: Refresh embedded OUI registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Exactly what this workflow does: push a data branch (contents) and
          # open/update/label the refresh PR (pull-requests). Do NOT add
          # permission-issues -- the msn-ci-bot installation does not grant it
          # and create-github-app-token hard-fails on a permission the
          # installation lacks; `--label` on a pull request is covered by
          # pull-requests. permission-workflows is not needed either: the PR
          # only ever touches oui.txt.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The App token has to be the persisted credential, not just the one
          # `gh pr create` sees: when the refresh branch already exists this
          # run window the job pushes to an open PR, and a GITHUB_TOKEN-authored
          # push fires no `synchronize`, so the PR's CI would go stale.
          token: ${{ steps.app-token.outputs.token }}

      - name: Download latest IEEE OUI registry
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # Retry a few times — the IEEE host occasionally rate-limits.
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 120 \
                -A "The Seed OUI refresh (+https://github.com/MustardSeedNetworks/seed)" \
                -o "$tmp" "$OUI_URL"; then
              break
            fi
            echo "download attempt $attempt failed; retrying..."
            sleep 10
          done

          # Sanity-check: a real registry is several MB and uses the "(hex)" format.
          size="$(wc -c < "$tmp")"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::Downloaded OUI file too small ($size bytes) — refusing to embed."
            exit 1
          fi
          if ! grep -q '(hex)' "$tmp"; then
            echo "::error::Downloaded OUI file is not in IEEE (hex) format — refusing to embed."
            exit 1
          fi

          # The IEEE source is CRLF; the embedded file is pinned to LF
          # (.gitattributes) for byte-for-byte determinism — normalize before
          # writing so the validated bytes match the committed bytes.
          perl -pi -e 's/\r\n/\n/g' "$tmp"
          mv "$tmp" "$OUI_PATH"
          echo "Refreshed $OUI_PATH ($size bytes)"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- "$OUI_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OUI registry unchanged — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate the refreshed registry parses and tests pass
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # CGO-free: the resolve package has no C deps.
          CGO_ENABLED=0 go build ./internal/discovery/resolve/...
          CGO_ENABLED=0 go test ./internal/discovery/resolve/... -run 'TestNewOUIDatabase|TestOUILookup' -count=1

      - name: Open refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          branch="chore/oui-refresh-${stamp}"
          entries="$(grep -c '(hex)' "$OUI_PATH" || echo '?')"

          # Commit as the App that pushes and opens the PR, so author and
          # actor agree. The numeric id is what makes the noreply address
          # resolve to the bot account.
          app_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Reuse an open refresh branch if it already exists this run window.
          git switch -c "$branch" 2>/dev/null || git switch "$branch"
          git add "$OUI_PATH"
          git commit -m "chore(discovery): refresh embedded IEEE OUI registry (${stamp})"
          git push -u origin "$branch" --force-with-lease

          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR for $branch already open — updated in place."
          else
            gh pr create \
              --title "chore(discovery): refresh embedded IEEE OUI registry (${stamp})" \
              --body "Automated monthly refresh of the embedded IEEE OUI registry (\`${OUI_PATH}\`, ~${entries} assignments) from ${OUI_URL}. Validated: builds + resolve lookup tests pass. Merge to ship the updated MAC→vendor baseline in the next build." \
              --label dependencies
          fi
