name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The scan reads only the module and ui/ manifests; a PR that changes
    # neither cannot change its result, and main still scans every push.
    paths:
      - go.mod
      - go.sum
      - ui/package.json
      - ui/package-lock.json
      - .github/workflows/license-check.yml
  schedule:
    # Run weekly on Mondays at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate is defined once in the fleet-shared repo; this repo only wires it.
  # To change license policy for the fleet, edit that workflow, not this file.
  # foundation + modernc.org/mathutil are already ignored there fleet-wide.
  license-check:
    uses: MustardSeedNetworks/.github/.github/workflows/license-check.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
