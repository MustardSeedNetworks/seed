# =============================================================================
# CI Pipeline - The Seed
# =============================================================================
# Main CI pipeline running on every push/PR to main.
#
# Features:
# - Actions pinned to full commit SHAs for reproducibility
# - Go version from go.mod, Node.js from .github/actions/setup-node
# - Full staticcheck analysis (dead-code.yml handles weekly U* reports)
# - Deterministic builds with -trimpath -buildvcs=false
# - Build verification for amd64 and arm64 release targets
# - Frontend build artifact sharing between jobs
#
# Related workflows:
# - license-check.yml: License compliance (not duplicated here)
# - dead-code.yml: Weekly unused code reports
# - codeql.yml: Security analysis
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ===========================================================================
  # Adds ~5s to every run; saves several minutes when a PR only touches one
  # area (e.g. docs-only changes skip backend/frontend/c jobs entirely).
  # The CI Complete aggregator at the bottom of this file enforces that all
  # required jobs either passed or were intentionally skipped, so branch
  # protection can require just CI Complete instead of every individual job.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      c: ${{ steps.filter.outputs.c }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'mk/**'
              # Embedded migration baseline + its schema-gate golden are Go test
              # inputs (//go:embed in internal/database); a change here must run
              # the Go suite even when no .go file moves.
              - 'internal/database/migrations/**'
              - 'internal/database/testdata/**'
              - '.github/actions/setup-go/**'
              - '.github/actions/setup-libpcap/**'
            frontend:
              - 'ui/**'
              - 'scripts/test-storybook-contract.sh'
              - '.github/actions/setup-node/**'
            c:
              - 'src/**'
              - 'include/**'
              - 'tests/c/**'
              - '.clang-tidy'
              - '.clang-format'
            docs:
              - '**/*.md'
            workflows:
              - '.github/workflows/**'

  # ===========================================================================
  # Build UI once, shared via artifact
  # ===========================================================================
  # backend, race, and frontend all need internal/api/ui/ populated (Go's
  # //go:embed in internal/api/embed_ui.go, or the frontend job's own checks).
  # Building it three times per run was wasteful — build it once here and let
  # every consumer download the artifact instead.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Upload built UI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1

  # ===========================================================================
  # Go Backend Checks
  # ===========================================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Download built UI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install UI dependencies
        # npm ci (not a build) — needed by check-types-drift.sh, which runs
        # `npm --prefix ui run gen-types` below. The actual built UI assets
        # come from the build-ui job's shared artifact, downloaded above.
        working-directory: ui
        run: npm ci

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # Full-tree lint verified clean on 2026-08-14. Keep CI aligned with
          # the repository-wide zero-warning policy.
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Verify API schemas are up to date
        run: ./scripts/check-schema-drift.sh

      - name: Verify generated TS types are up to date
        run: ./scripts/check-types-drift.sh

      - name: Output-escaping / XSS gate (#1225)
        run: ./scripts/check-output-escaping.sh

      - name: Route-policy gate — capability registry (ADR-0002)
        run: ./scripts/check-route-policy.sh

      - name: JSON wire-casing gate — camelCase ratchet (ADR-0010)
        run: ./scripts/check-json-casing.sh

      - name: Filename-policy gate — no monolith naming outside internal/api
        run: ./scripts/check-filename-policy.sh

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Check formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"

      - name: Run tests
        env:
          SKIP_IPERF_TEST: "1"
          SKIP_NETWORK_TESTS: "1"
        run: go test -v -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Current coverage: ${COVERAGE}%"

          # Minimum coverage threshold. Acts as an anti-regression floor.
          # Actual coverage is 54.0%, so the old floor of 42 left a 12pp hole a
          # regression could fall through unnoticed. 50 is the fleet minimum
          # and matches stem and niac.
          # Ratchet plan (see #959):
          #   2026-Q3: 50 (current — fleet minimum)
          #   2027-Q2: 60
          #   long-term: 70
          MIN_COVERAGE=50

          if (( $(echo "$COVERAGE < $MIN_COVERAGE" | bc -l) )); then
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
          fi

          echo "✅ Coverage check passed (${COVERAGE}% >= ${MIN_COVERAGE}%)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Deterministic build check
        run: go build -trimpath -buildvcs=false ./...

      # Phase 6 capture port: the whole tree must build with CGO disabled, using
      # the CGO-free null capture adapter. libpcap is confined to the build-tagged
      # internal/capture/pcap package, which the ./... wildcard skips under
      # CGO_ENABLED=0. A regression that re-imports gopacket/pcap from a domain
      # package (depguard also guards this) would fail here.
      # See docs/architecture/CGO_BUILD_STRATEGY.md.
      - name: CGO-free build check (null capture adapter)
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ===========================================================================
  # Go Race Detector
  # ===========================================================================
  # Race detection moved here from the pre-commit hook (#945). Hook ran fast
  # short tests; this job runs the full suite under -race on every push/PR.
  # Blocking — the cmd/seed t.Parallel() races discovered when this job was
  # introduced were fixed in the same PR (#947) by dropping parallelism from
  # cmd/seed tests, since subtests shared a single cobra.Command parent and
  # raced on its sortedFlags cache.
  race:
    name: Backend (race detector)
    runs-on: ubuntu-latest
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 20
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Download built UI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Run tests with race detector
        env:
          SKIP_IPERF_TEST: "1"
          SKIP_NETWORK_TESTS: "1"
        run: go test -short -race ./...

  # ===========================================================================
  # Frontend Checks
  # ===========================================================================
  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    needs: [changes, build-ui]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Verify package-lock integrity
        run: git diff --exit-code package-lock.json

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run Biome (lint + format)
        run: npm run lint

      - name: Design token discipline (Phase 0 gate)
        run: ../scripts/check-token-discipline.sh

      - name: Run unit tests
        run: npm run test
      # Build is done once by the build-ui job and shared as the
      # frontend-dist artifact (downloaded by backend/race/build/e2e/
      # lighthouse). This job validates source (types/lint/tests) only.

  # ===========================================================================
  # Storybook interaction and accessibility checks
  # ===========================================================================
  storybook:
    name: Storybook interactions and accessibility
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: node ./node_modules/playwright/cli.js install --with-deps chromium

      - name: Run interaction and accessibility tests
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: npm run test:storybook

      - name: Verify injected defects fail the gate
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: npm run test:storybook:contract

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      contents: read
      # Uploads gosec + Trivy SARIF to the code-scanning tab. actions:read
      # is paired with security-events:write per the pattern already used in
      # codeql.yml — SARIF upload fails without it.
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Run govulncheck
        run: make security-backend-quiet

      # gosec is ENFORCED (blocking) by the golangci-lint job: `gosec` is an
      # enabled linter there, and high-signal rules fail the build — verified:
      # G401/G501 (weak crypto), G101 literal secrets, etc. are caught. The
      # taint/heuristic rules that are FP-prone by nature (G204 subprocess,
      # G304 file-from-variable, G115 integer-conversion) are excluded from the
      # gate via golangci-lint's `common-false-positives` preset (.golangci.yml,
      # exclusions.presets) — a deliberate, documented decision: in this codebase
      # those fire on safe dynamic paths, controlled network-tool args, and
      # already-bounds-checked SNMP conversions.
      #
      # The standalone run below scans with the DEFAULT (un-pruned) rule set and
      # exists ONLY to publish SARIF to the GitHub code-scanning / Security tab,
      # so those taint-rule findings stay visible for review. It is intentionally
      # continue-on-error (a visibility feed, not a second gate) and must not be
      # promoted to blocking — that would gate on the known FP-prone rule set the
      # golangci-lint gate intentionally excludes.
      - name: Run gosec (SARIF visibility only — gate is golangci-lint)
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        continue-on-error: true
        with:
          args: "-fmt sarif -out gosec-results.sarif ./..."

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        run: |
          cd ui && npm ci
          cd .. && make security-frontend-quiet

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config,
      # and identical to the version pinned in .pre-commit-config.yaml. Scans
      # full history (the security job checks out with fetch-depth: 0).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Run Trivy vulnerability scanner
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. We do this in a separate step so
        # the SARIF is always uploaded for security tab visibility.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

      # License compliance is handled by the dedicated license-check.yml workflow
      # to avoid duplication. See .github/workflows/license-check.yml

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is skipped entirely on private repos)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step (see
  # #1736). WARNING/MEDIUM findings are visible in the job log but do not fail
  # the build yet; ratchet to a stricter --severity once the current WARNING
  # backlog (missing-ssl-minversion, math-random-used, dependabot-missing-
  # cooldown) is triaged in a follow-up. Three known false positives are
  # already annotated inline with `// nosemgrep: <rule-id> -- <reason>`
  # (mirroring the existing `#nosec`/`//nolint:gosec` justifications) so the
  # ratchet won't need to re-litigate them: internal/auth/hibp.go (SHA-1 is
  # the HIBP k-anonymity API contract), internal/api/oauth.go (hardcoded
  # provider URL + prefix-check guard), internal/api/handlers_auth.go
  # (intentional double-submit CSRF cookie, Secure+SameSiteStrict).
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@762b756e6fb5803443b9bcfdba03b88596c18e04 # v1.0.0
    permissions:
      contents: read

  # ===========================================================================
  # Code Quality Checks
  # ===========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: File-size gate (baseline-ratchet)
        # Adopts niac/go's implementation, which enforces instead of warning.
        # The previous STRICT=0 mode reported violations and always exited 0,
        # so the gate was inert. Red-flag files present at adoption are
        # recorded in scripts/file-size-baseline.txt with their current size
        # and may not grow; anything new or increased fails. Sub-red-flag size
        # debt still reports as a warning without failing.
        run: ./scripts/check-file-size.sh

      - name: Enforce customer-facing vocabulary policy
        run: |
          python3 scripts/test-check-banned-vocabulary.py
          python3 scripts/check-banned-vocabulary.py

      - name: Verify release workflow dispatch contract
        run: ./scripts/test-check-release-workflow-contract.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE=".env credentials.json secrets.yaml *.pem *.key"
          for file in $SENSITIVE; do
            if find . -name "$file" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
              echo "ERROR: Sensitive file pattern '$file' found"
              exit 1
            fi
          done
          echo "No sensitive files detected"

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."

          # Patterns that may log sensitive data (excluding test files and logging package itself)
          DANGEROUS_PATTERNS=(
            'log\.Print.*r\.Body'
            'log\.Print.*bodyBytes'
            'log\.Print.*req\.Password'
            'log\.Print.*\.password'
            'log\.Print.*\.token'
            'log\.Print.*Authorization'
            'log\.Print.*X-Api-Key'
            'io\.ReadAll.*r\.Body.*log'
            'fmt\.Printf.*r\.Body'
            'fmt\.Printf.*password'
          )

          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            # Search Go files, excluding tests and the logging package
            if grep -rn -E "$pattern" \
              --include="*.go" \
              --exclude="*_test.go" \
              --exclude-dir=internal/logging \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              internal/ cmd/ 2>/dev/null; then
              echo "❌ Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Use internal/logging.Redact* functions to safely log data"
            echo "See internal/logging/redact.go for examples"
            exit 1
          fi

          echo "✅ No unsafe logging patterns detected"

  # ===========================================================================
  # C Code Linting (if applicable)
  # ===========================================================================
  # ===========================================================================
  # C Lint (C23 Standard - NOT C++)
  # ===========================================================================
  c-lint:
    name: C Lint (C23)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.c == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install C23 tools (clang-tidy, cppcheck, bear)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            clang-tidy-18 \
            clang-format-18 \
            cppcheck \
            bear \
            gcc-13
          
          # Set clang-18 as default
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          
          # Verify versions
          clang --version
          clang-tidy --version
          gcc-13 --version

      - name: Check if C files exist
        id: check-c
        run: |
          if find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
            echo "Found C source files"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
            echo "No C source files found - C23 linting ready for when C code is added"
          fi

      - name: Generate compile_commands.json
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          # Create basic compile_commands.json for clang-tidy
          cat > compile_commands.json << 'EOF'
          [
            {
              "directory": "${{ github.workspace }}",
              "command": "gcc-13 -std=c23 -Wall -Wextra -Wpedantic -Iinclude -c placeholder.c",
              "file": "placeholder.c"
            }
          ]
          EOF
          
          # Use bear to generate proper compile_commands.json if Makefile exists
          if [ -f "Makefile" ]; then
            export CC=gcc-13
            bear -- make || true
          fi

      - name: Run clang-format check (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Checking C code formatting (C23 standard)..."
          find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | \
            xargs clang-format --dry-run --Werror --style=file

      - name: Run clang-tidy (C23)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running clang-tidy with C23 checks..."
          find . -name '*.c' -o -name '*.h' 2>/dev/null | grep -v node_modules | \
            xargs clang-tidy \
              --config-file=.clang-tidy \
              --extra-arg=-std=c23 \
              --extra-arg=-Iinclude \
              --warnings-as-errors='*'

      - name: Run cppcheck (C only, not C++)
        if: steps.check-c.outputs.has_c == 'true'
        run: |
          echo "Running cppcheck for C code..."
          cppcheck \
            --std=c23 \
            --language=c \
            --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --inline-suppr \
            --error-exitcode=1 \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I include \
            . 2>&1 | tee cppcheck.log
          
          if [ -s cppcheck.log ]; then
            echo "::warning::cppcheck found issues"
          fi

  # ===========================================================================
  # Workflow Linting
  # ===========================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks. It
  #                caught a duplicated `with:` key in this very file that
  #                PyYAML accepts silently by keeping the last occurrence.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the two that survive review carry
  #                `# zizmor: ignore[...]` comments with the reasoning inline.
  #                Low/Informational (~25) are reported but not yet enforced.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.29.0
          zizmor --min-severity high --color always .github/workflows/


  # ===========================================================================
  # Internationalization (i18n) Checks
  # ===========================================================================
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shared i18n validator
        # Replaces the prior inline stub (which used the wrong path
        # `locales/en/*.json` — should be `internal/i18n/locales/en/`
        # — so it never actually ran). The shared script enforces
        # I18N_CONVENTIONS.md across all 3 products: key parity, no
        # empty values, no t('key', 'fallback') patterns, locale
        # vocabulary, glossary preservation, interpolation parity,
        # plural completeness, t()→key cross-reference, locked
        # versions, and a warn-only hardcoded-JSX heuristic.
        #
        # --ratchet demotes the new check_key_usage from error → warn
        # while seed's 329 pre-existing wrong-namespace t() calls
        # are queued for cleanup. Drop --ratchet once they're gone.
        run: ./scripts/i18n/validate.sh --ratchet

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The wiki/template checks apply to every PR regardless of which paths
    # changed. External link checking is NOT here: it walks every URL in every
    # .md file, took ~6 min (the longest job in this workflow), and failed for
    # reasons unrelated to the diff — dead third-party links — which is why it
    # had been pinned to continue-on-error and therefore enforced nothing.
    # It now runs on a schedule instead: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          # Config-level ignores are honoured by markdownlint-cli2 itself; only
          # drop paths it never sees so an empty result skips the step cleanly.
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~1.1k pre-existing violations of its own .markdownlint.json; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

      - name: Validate wiki navigation
        run: |
          echo "Checking wiki navigation links..."
          WIKI_DIR="docs/wiki"

          # Extract all wiki links from Home.md
          HOME_LINKS=$(grep -oP '\]\(\K[^)]+' "$WIKI_DIR/Home.md" | grep -v '^http' | grep -v '^#' || true)

          # Check each link exists as a .md file
          for link in $HOME_LINKS; do
            # Convert link to filename (e.g., "Intel-WiFi" -> "Intel-WiFi.md")
            if [[ ! "$link" =~ \.md$ ]]; then
              link="$link.md"
            fi

            if [[ ! -f "$WIKI_DIR/$link" ]]; then
              echo "ERROR: Broken wiki link: $link (referenced in Home.md but file not found)"
              exit 1
            fi
          done

          echo "All wiki navigation links are valid"

      - name: Check template references
        run: |
          echo "Verifying test report templates..."

          # Templates should exist
          TEMPLATES=(
            "docs/templates/WIFI_TEST_REPORT.md"
            "docs/templates/ETHERNET_TEST_REPORT.md"
          )

          for template in "${TEMPLATES[@]}"; do
            if [[ ! -f "$template" ]]; then
              echo "ERROR: Missing template: $template"
              exit 1
            fi
          done

          # Templates should be referenced in CONTRIBUTING.md
          if ! grep -q "WIFI_TEST_REPORT\|ETHERNET_TEST_REPORT" CONTRIBUTING.md; then
            echo "WARNING: Templates not referenced in CONTRIBUTING.md"
          fi

          echo "All test report templates are valid"

  # ===========================================================================
  # Build Verification
  # ===========================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 20
    # Build needs the frontend-dist artifact; only runs when frontend ran.
    # The always() guard lets this job evaluate even when `backend` was
    # skipped (skipped upstream would otherwise skip this job implicitly).
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Build Go binary (amd64)
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches Makefile recipe; mandatory per build policy.
          # Universal Build Contract — /__version must return non-empty
          # uiBuildHash to prove the UI was embedded.
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/seed/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/seed/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/seed/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/seed/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o seed-linux-amd64 ./cmd/seed

      - name: Install arm64 cross-build dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-amd64.list >/dev/null <<'EOF'
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu noble main universe multiverse restricted
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu noble-updates main universe multiverse restricted
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu noble-backports main universe multiverse restricted
          deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main universe multiverse restricted
          EOF
          for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list; do
            [ -f "$f" ] || continue
            case "$f" in
              */ubuntu-amd64.list|*/ports-arm64.list) continue ;;
            esac
            sudo sed -i '/^deb \[/!s|^deb |deb [arch=amd64] |' "$f"
          done
          sudo tee /etc/apt/sources.list.d/ports-arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main universe multiverse restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe multiverse restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main universe multiverse restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-backports main universe multiverse restricted
          EOF

          sudo apt-get update || true
          sudo apt-get install -y gcc-aarch64-linux-gnu linux-libc-dev:arm64 libpcap-dev:arm64 libpcap0.8-dev:arm64 pkg-config

      - name: Build Go binary (arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
        run: |
          # Reuses UI_BUILD_HASH semantics from the amd64 step but computes
          # afresh (each step gets its own shell — env doesn't persist).
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w \
              -X github.com/MustardSeedNetworks/seed/internal/version.Version=${VERSION} \
              -X github.com/MustardSeedNetworks/seed/internal/version.Commit=${COMMIT} \
              -X github.com/MustardSeedNetworks/seed/internal/version.BuildTime=${BUILD_TIME} \
              -X github.com/MustardSeedNetworks/seed/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
            -o seed-linux-arm64 ./cmd/seed

      - name: Verify binaries
        run: |
          echo "=== AMD64 Binary ==="
          file seed-linux-amd64
          ls -la seed-linux-amd64
          echo ""
          echo "=== ARM64 Binary ==="
          file seed-linux-arm64
          ls -la seed-linux-arm64

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # Static check: the binary must contain the md5 hash of the
        # embedded UI assets, proving the -X ...UIBuildHash=... ldflag
        # was set during go build. Failing here means /__version would
        # return uiBuildHash="unknown" in production — silent contract
        # violation. Static check is cheaper + more reliable than
        # starting the server with TLS+DB in CI.
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — frontend-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(./scripts/ui-build-hash.sh)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '$EXPECTED'"
            exit 1
          fi
          echo "Expected UIBuildHash: $EXPECTED"
          for bin in seed-linux-amd64 seed-linux-arm64; do
            if strings "$bin" | grep -qF "$EXPECTED"; then
              echo "  ✓ $bin: UIBuildHash embedded correctly"
            else
              echo "::error::$bin does not contain UIBuildHash $EXPECTED"
              echo "  → Universal Build Contract violated. Check -X ...UIBuildHash=... ldflag in 'Build Go binary' step."
              exit 1
            fi
          done

  # ===========================================================================
  # E2E Browser Tests (Playwright)
  # ===========================================================================
  e2e:
    name: E2E Browser Tests (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 15
    # Blocking tier — "CI Complete" gates on this job (see ci-complete.needs).
    # 2 shards × 2 browsers = 4 jobs. This was 4 × 2 = 8; per-shard wall-clock
    # was indeed ~3–5 min, but the 8 shards did not start together — measured
    # run 31840685070 launched them in waves at t+9, t+11 and t+12 min against
    # a 24-job run, so the last shard finished at t+15 and the sharding added
    # queue latency instead of removing wall-clock. Sharding past the available
    # runner concurrency costs both time and billing. Re-measure before
    # widening this axis again.
    #
    # continue-on-error was REMOVED once the suite went flake-free (the rotating
    # post-login dashboard flake was fixed in #1588; full-suite main runs are 0
    # hard failures / 0 flaky). The flag had masked real failures from the
    # ci-complete aggregator, so the full E2E suite could not gate merge.
    # Tradeoff now made explicit: a genuine E2E failure flips the CI workflow_run
    # conclusion to failure, which defers release-please's workflow_run success
    # gate (release-please.yml) to the next green CI run. That is the intended
    # behavior — main being E2E-red should NOT cut a release — and release-please
    # re-triggers on the next push. If a flake recurs, fix or quarantine it (do
    # NOT re-add continue-on-error); retries:1 in playwright.config.ts already
    # absorbs single transient failures.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    # Skipped on draft PRs (slow); also skipped if no frontend/backend changed.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install frontend dependencies (for Playwright)
        working-directory: ui
        run: npm ci

      - name: Build backend
        run: make --no-print-directory build-backend-quiet

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright OS dependencies
        working-directory: ui
        timeout-minutes: 8
        # apt packages only, not cacheable — runs unconditionally regardless of
        # whether the browser binaries were restored from the cache above. Not
        # removable: the runner image ships none of webkit's GStreamer/font
        # stack (181 packages, 114 MB on a clean run).
        #
        # A stalled Ubuntu mirror can hang apt for the whole job budget without
        # running a test (stem job 95068053052), because apt waits forever on a
        # dead connection by default. Bound apt's own network waits, then retry
        # the transient case.
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          DPkg::Lock::Timeout "60";
          EOF
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # A timeout kill can leave dpkg half-configured; recover first.
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            if timeout -k 15 120 npx playwright install-deps; then
              exit 0
            fi
            echo "playwright install-deps attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::playwright install-deps failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        # Per E2E_CONVENTIONS: chromium (Chrome+Edge) and webkit (Safari).
        # --with-deps omitted — OS deps are installed unconditionally above.
        run: npx playwright install chromium webkit

      - name: Run Playwright E2E tests (full suite minus smoke)
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SERVER_LOG: server.log
        # Smoke tier runs in the e2e-smoke job; full e2e skips it to
        # avoid duplicate runtime. See seed#1053.
        # Both chromium and webkit run per E2E_CONVENTIONS — the projects
        # array in playwright.config.ts is now exactly [chromium, webkit].
        run: ./scripts/run-e2e.sh --reporter=html --project=${{ matrix.browser }} --grep-invert "@smoke" --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: server-logs-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: server.log
          retention-days: 7

  # ===========================================================================
  # E2E Smoke Tests (Playwright tier-1 / required)
  # ===========================================================================
  # Smaller, faster subset of the Playwright suite covering the critical
  # paths (login, dashboard renders, theme toggle, smoke-spec checks).
  # Runs the @smoke-tagged tests only — currently ~33 tests, target
  # runtime < 5 minutes. Designed to be gated by branch protection as
  # the user-visible E2E signal, distinct from the full e2e job which
  # is advisory. See seed#1053.
  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 15
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Install frontend dependencies (for Playwright)
        working-directory: ui
        run: npm ci

      - name: Build backend
        run: make --no-print-directory build-backend-quiet

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright OS dependencies
        working-directory: ui
        timeout-minutes: 8
        # apt packages only, not cacheable — runs unconditionally regardless of
        # whether the browser binaries were restored from the cache above. Not
        # removable: the runner image ships none of webkit's GStreamer/font
        # stack (181 packages, 114 MB on a clean run).
        #
        # A stalled Ubuntu mirror can hang apt for the whole job budget without
        # running a test (stem job 95068053052), because apt waits forever on a
        # dead connection by default. Bound apt's own network waits, then retry
        # the transient case.
        run: |
          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          DPkg::Lock::Timeout "60";
          EOF
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # A timeout kill can leave dpkg half-configured; recover first.
              sudo dpkg --configure -a >/dev/null 2>&1 || true
            fi
            if timeout -k 15 120 npx playwright install-deps; then
              exit 0
            fi
            echo "playwright install-deps attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::playwright install-deps failed after 3 attempts"
          exit 1

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ui
        # Per E2E_CONVENTIONS: chromium (Chrome+Edge) and webkit (Safari).
        # --with-deps omitted — OS deps are installed unconditionally above.
        run: npx playwright install chromium webkit

      - name: Run Playwright @smoke tests
        env:
          E2E_SKIP_BUILD: "1"
          E2E_SERVER_LOG: server.log
        # Both chromium and webkit run; smoke tier on both browsers per PR
        # per E2E_CONVENTIONS.
        run: ./scripts/run-e2e.sh --reporter=html --grep "@smoke"

      - name: Upload Playwright smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-smoke-report
          path: ui/playwright-report/
          retention-days: 7

      - name: Upload server logs on smoke failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-server-logs
          path: server.log
          retention-days: 7

  # ===========================================================================
  # Lighthouse CI - Performance & Accessibility Audits
  # ===========================================================================
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 15
    # Skipped on draft PRs (slow); only runs when frontend changed.
    # always() lets the if: evaluate when backend was skipped upstream.
    if: |
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.frontend.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap

      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: internal/api/ui/

      - name: Build backend
        run: |
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w" \
            -o seed ./cmd/seed

      - name: Start backend server
        env:
          SEED_CONFIG_PATH: ${{ runner.temp }}/seed/config.yaml
          SEED_LOGIN_MAX_ATTEMPTS: "200"
        run: |
          mkdir -p data
          sudo setcap cap_net_raw=+ep ./seed || true
          nohup ./seed --config "$SEED_CONFIG_PATH" > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -sk https://localhost:8443/ >/dev/null 2>&1; then
              echo "Server ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i: Server not ready, waiting..."
            sleep $((i < 5 ? 1 : 2))
          done
          echo "Server failed to start after 30 attempts"
          cat server.log
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://localhost:8443
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload server logs on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lighthouse-server-logs
          path: server.log
          retention-days: 7

  # ===========================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ===========================================================================
  # Every required-status-check on `main` is consolidated into this single
  # job. It fails if any upstream job actually failed; it passes if every
  # upstream either succeeded or was intentionally skipped via the path
  # filter. Branch protection requires ONLY "CI Complete" (plus "Lint PR
  # Title" / "Lint PR Body" from their own workflows) rather than
  # enumerating every individual job — so a docs-only PR can merge cleanly
  # when backend/frontend/c are all skipped. CodeQL and license-check are
  # NOT required contexts: CodeQL is advisory (and skips entirely on
  # private repos) and license-check reports without blocking. The
  # `semgrep` job in this file is the required SAST gate (blocking on
  # ERROR severity).
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The full E2E browser suite (e2e) and E2E Smoke now gate merge through
    # this aggregator — the suite went flake-free after #1588, so it can be
    # trusted to block. Branch protection requires ONLY "CI Complete" (plus
    # "Lint PR Title" / "Lint PR Body"), NOT the individual E2E shard names:
    # enumerating "E2E Browser Tests (webkit 3/4)" ×8 in branch protection is
    # brittle (a reshard silently breaks every required entry) and was also
    # toothless while e2e carried continue-on-error. The aggregator's
    # success-or-skipped check below handles the path-filter case (a
    # docs/backend-only PR skips e2e and still passes) without the
    # skipped-required-check deadlock.
    #
    # lighthouse stays excluded — it's a genuine perf-advisory signal, not a
    # correctness gate.
    needs:
      - changes
      - build-ui
      - workflow-lint
      - backend
      - race
      - frontend
      - storybook
      - security
      - semgrep
      - quality
      - c-lint
      - i18n
      - docs
      - build
      - e2e
      - e2e-smoke
    if: always()
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          # Fail if any upstream is anything other than success or skipped.
          # (cancelled and failure both fail this gate.)
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
