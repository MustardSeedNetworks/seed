# =============================================================================
# CI Pipeline - The Seed
# =============================================================================
# Main CI pipeline for pull requests, the merge queue, and manual dispatch.
# Push to main does not run this workflow. The merge group already tested
# that commit. release-please still needs a CI result on main, which
# ci-main-smoke.yml supplies.
#
# Shared callers — changes, backend, race, frontend, storybook, and e2e —
# pin MustardSeedNetworks/.github at e092081a97245d29978e229be7425179cc1dcde1
# (.github#163). That commit pins apt-install and flake-budget inside the
# called workflows, so this repo does not vendor those actions. Jobs that
# stay in this file still use ./.github/actions/setup-go and setup-node.
#
# Features:
# - Actions pinned to full commit SHAs for reproducibility
# - Go version from go.mod, Node.js from .github/actions/setup-node
# - Full staticcheck analysis (dead-code.yml handles weekly U* reports)
# - Deterministic builds with -trimpath -buildvcs=false
# - Build verification for amd64 and arm64 release targets
# - Frontend build artifact sharing between jobs
#
# Related workflows:
# - license-check.yml: License compliance (not duplicated here)
# - dead-code.yml: Weekly unused code reports
# - codeql.yml: Security analysis
# =============================================================================

name: CI

on:
  # No push trigger. A push to main is the commit the merge queue just
  # tested, and re-running this suite there doubled the bill. See
  # ci-main-smoke.yml for the result release-please still listens for.
  pull_request:
    branches: [main]
  # Required for the merge queue: `CI Complete` is a required status check, so
  # it must report on merge_group events too. Without this the queue would
  # accept PRs and then wait forever for a check that never fires.
  merge_group:
  workflow_dispatch:

concurrency:
  # PRs share one group per ref, so a newer push cancels the stale run.
  #
  # A manual dispatch on main is keyed per commit and is not cancelled.
  # cancel-in-progress off on main protects a *running* build only: GitHub
  # keeps one pending run per group and cancels the older when a newer
  # arrives, and a cancelled run has no success conclusion. release-please
  # is gated on workflow_run success, so a cancelled main run skips that
  # commit. Keying main by SHA gives every commit its own group. Push to
  # main no longer runs this file; ci-main-smoke.yml repeats the same rule
  # for the runs that do.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Path filter — classifies which areas changed so downstream jobs can skip
  # ===========================================================================
  # The matcher is scripts/ci-changes.py in the pinned .github commit. On
  # merge_group every declared filter is true: the queue has no PR base to
  # diff against. pull_request and workflow_dispatch still filter. id-token:
  # write is how that workflow reads its own commit; without it the job fails
  # closed rather than classifying paths with whatever main currently says.
  # CI Complete needs this job, so branch protection can require that one
  # check instead of every individual job.
  changes:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-changes.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      filters: |
        backend:
          - '**/*.go'
          - 'go.mod'
          - 'go.sum'
          - 'Makefile'
          - 'mk/**'
          # Embedded migration baseline + its schema-gate golden are Go test
          # inputs (//go:embed in internal/database); a change here must run
          # the Go suite even when no .go file moves.
          - 'internal/database/migrations/**'
          - 'internal/database/testdata/**'
          # cmd/seed-openapi renders docs/openapi.yaml from this source and
          # the route registry; editing either alone must run the drift gate.
          - 'docs/openapi-source.yaml'
          - 'docs/openapi.yaml'
          # The locale catalogue is //go:embed'ed by internal/i18n and
          # imported by the UI through the @locales alias, so a
          # translation-only change is an input of both test suites and
          # of the i18n job that the frontend filter gates.
          - 'internal/i18n/locales/**'
        frontend:
          - 'ui/**'
          - 'internal/i18n/locales/**'
        darwin_bridge:
          - 'internal/**/*_darwin.h'
          - '.clang-format'
        docs:
          - '**/*.md'
        # Everything that implements a CI gate, not just the workflow that
        # calls it. scripts/ holds the gate scripts, and a PR that weakened
        # one used to stay green because CI Complete accepts skipped.
        ci_infra:
          - '.github/workflows/**'
          - '.github/actions/**'
          - 'scripts/**'
          - '.golangci.yml'
          - 'biome.json'
          - 'ui/biome.json'

  # ===========================================================================
  # Build UI once, shared via artifact
  # ===========================================================================
  # backend, race, and frontend all need internal/api/ui/ populated (Go's
  # //go:embed in internal/api/embed_ui.go, or the frontend job's own checks).
  # Building it three times per run was wasteful — build it once here and let
  # every consumer download the artifact instead.
  build-ui:
    name: Build UI (shared artifact)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: First-load bundle budget
        run: |
          python3 scripts/test-check-initial-bundle.py
          python3 scripts/check-initial-bundle.py

      - name: Upload built UI assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: internal/api/ui/
          retention-days: 1


  # ===========================================================================
  # Backend (Go, macOS, Windows, GOOS=windows lint) — fleet-shared ci-backend.yml
  # ===========================================================================
  # One caller. The Linux job is the product gate: golangci-lint, vet, the
  # drift and policy scripts, tests, the coverage floor, the deterministic
  # and CGO-free builds, and go mod tidy. macOS builds and vets the tree and
  # race-tests internal/wifi. Windows builds with CGO_ENABLED=0 and runs the
  # port-fallback tests. Both native jobs stay off pull_request
  # (skip-native-on-pull-request defaults true): macOS runners are 10x the
  # minutes, and the merge queue still runs them because changes forces every
  # filter true there.
  #
  # On workflow_dispatch the native jobs run whenever this caller runs. That
  # is wider than their old path filter, which required backend or ci_infra.
  # A frontend-only dispatch now builds darwin and windows too. PRs still
  # skip them.
  #
  # lint-windows stays the shared job (full tree, skip-cache, every event).
  # The input keeps the old path filter: a frontend-only PR still runs the
  # Linux backend, because the UI is embedded, and does not pay for a second
  # lint of the Windows tree.
  backend:
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-backend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: true
      setup-node: true
      ui-artifact: frontend-dist
      ui-install: true
      golangci-lint-version: v2.14.0
      golangci-lint-args: --timeout=5m
      fetch-depth: 0
      native-fetch-depth: 0
      timeout-minutes: 20
      lint-windows: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true' }}
      windows-vet-command: GOOS=windows CGO_ENABLED=0 go vet ./internal/api/...
      darwin-test-command: go test -race ./internal/wifi/...
      windows-test-command: go test ./internal/api/ -run 'IsAddrInUse|BindWithFallback' -v
      extra-command: |
        ./scripts/check-package-reachability.sh
        node --test scripts/check-ui-file-reachability.test.ts
        node scripts/check-ui-file-reachability.ts
        ./scripts/check-hardware-matrix.sh
        ./scripts/check-tailwind-classes.sh
        python3 scripts/test-check-component-variants.py
        python3 scripts/check-component-variants.py
        ./scripts/check-schema-drift.sh
        ./scripts/check-openapi-drift.sh
        ./scripts/check-types-drift.sh
        ./scripts/check-output-escaping.sh
        ./scripts/check-snmp-credential-surface.sh
        ./scripts/check-single-writer.sh
        ./scripts/check-route-policy.sh
        ./scripts/check-json-casing.sh
        ./scripts/check-error-shape.sh
        ./scripts/check-filename-policy.sh
        python3 scripts/test-check-route-consumers.py
        python3 scripts/check-route-consumers.py
        python3 scripts/check-ui-fetch.py
        python3 scripts/test-check-ui-generated-types.py
        python3 scripts/check-ui-generated-types.py
        python3 scripts/test-check-feature-catalog.py
        python3 scripts/check-feature-catalog.py
        python3 scripts/test-check-feature-gate-parity.py
        python3 scripts/check-feature-gate-parity.py
        python3 scripts/check-tsconfig-flags.py
        test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      build-command: |
        go build -trimpath -buildvcs=false ./...
        CGO_ENABLED=0 go build ./...
      test-command: SKIP_NETWORK_TESTS=1 go test -v -coverprofile=coverage.out ./...
      coverage-command: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        # Anti-regression floor. Measured 59.4% on ubuntu-latest, this job's
        # runner, on 2026-09-03 (#2374). 55 keeps about 4pp of headroom.
        # Measure on Linux with SKIP_NETWORK_TESTS=1 before moving it.
        # Ratchet: 55 now, 60 in 2027-Q2, 70 long-term.
        # bc -l may print 1 or 1.0. The shared step runs this under sh.
        MIN_COVERAGE=55
        below=$(echo "$COVERAGE < $MIN_COVERAGE" | bc -l)
        case "$below" in
          1*)
            echo "ERROR: Coverage ${COVERAGE}% is below minimum threshold of ${MIN_COVERAGE}%"
            exit 1
            ;;
        esac
        echo "Coverage check passed (${COVERAGE}% >= ${MIN_COVERAGE}%)"
      tidy-command: |
        go mod tidy
        git diff --exit-code go.mod go.sum

  # ===========================================================================
  # Go Race Detector — fleet-shared ci-race.yml
  # ===========================================================================
  # The full suite under -race, not -short: the detector is most useful on the
  # paths -short skips. SKIP_NETWORK_TESTS=1 matches the Linux test job. The
  # built UI is the frontend-dist artifact from build-ui.
  race:
    needs: [changes, build-ui]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      actions: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-race.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      install-libpcap: true
      ui-artifact: frontend-dist
      skip-network-tests: true
      timeout-minutes: 20

  # ===========================================================================
  # Benchmark regression gate
  # ===========================================================================
  # Gates on allocs/op, never on sec/op. Running the suite twice against
  # identical code showed sec/op swinging by up to +/-612% and calling 10 of 40
  # benchmarks "significantly changed"; allocs/op moved by at most 1%. Wall time
  # on a shared runner is not a signal, and a gate that fires on noise gets
  # switched off — which is how these 50 benchmarks came to never run at all
  # (#510). The measurement is written up in docs/BENCHMARKS.md.
  #
  # Base and head are measured on the SAME runner in the same job. Comparing
  # across runners would reintroduce exactly the machine-to-machine variance
  # this design exists to avoid.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 25
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.cache/go/build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap
        timeout-minutes: 10

      - name: Install benchstat
        # One unretried module fetch is enough to turn a required check red and
        # hold a PR out of the merge queue, which is what happened on #2156
        # (#2159). The pin is fine -- the same command installs cleanly locally.
        #
        # The loop exits non-zero when every attempt fails. #1950 records a
        # hand-rolled retry here that got that wrong: its exit branch tested
        # `attempt -eq 3` inside a `for attempt in 1 2` loop, so two failures
        # fell out of the loop and reported success. Both paths are covered by
        # scripts/test-retry-install.sh.
        run: ./scripts/retry-install-benchstat.sh

      - name: Benchmark head
        run: ./scripts/bench-run.sh > "$RUNNER_TEMP/head.txt"

      # The merge base, not the base branch tip: comparing against a moving tip
      # would attribute someone else's change to this PR.
      #
      # The runner script is copied out of the worktree first, because the merge
      # base generally predates it — running `make bench-save` over there failed
      # with exit 2 for exactly that reason. The copy discovers whatever
      # benchmarks that tree has, so a package added by this PR is simply absent
      # from the baseline rather than fatal.
      #
      # BASE_REF goes through env, not through ${{ }} interpolation: a branch
      # name is attacker-influenceable and expanding it into a shell command is
      # a template injection (zizmor template-injection).
      - name: Benchmark merge base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          cp scripts/bench-run.sh "$RUNNER_TEMP/bench-run.sh"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          echo "merge base: $base"
          git checkout --detach "$base"
          if ! "$RUNNER_TEMP/bench-run.sh" > "$RUNNER_TEMP/base.txt"; then
            git checkout -
            echo "::error::The benchmark baseline could not be measured at $base."
            echo "That is a problem with the base commit, not with this PR — but"
            echo "without a baseline there is nothing to compare against, so this"
            echo "job cannot tell a regression from a clean run. Failing loudly"
            echo "rather than passing on no evidence."
            tail -30 "$RUNNER_TEMP/base.txt" || true
            exit 1
          fi
          git checkout -

      - name: Compare
        run: |
          benchstat "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" \
            > "$RUNNER_TEMP/bench-compare.txt"
          cat "$RUNNER_TEMP/bench-compare.txt"
          echo
          python3 scripts/bench-compare.py "$RUNNER_TEMP/bench-compare.txt" \
            | tee "$RUNNER_TEMP/bench-verdict.txt"

      # Uploaded on failure too — the comparison is the whole point of the job,
      # and it is most wanted precisely when the gate has just failed.
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-comparison
          path: |
            ${{ runner.temp }}/head.txt
            ${{ runner.temp }}/base.txt
            ${{ runner.temp }}/bench-compare.txt
            ${{ runner.temp }}/bench-verdict.txt

  # ===========================================================================
  # Frontend (TypeScript) — fleet-shared ci-frontend.yml
  # ===========================================================================
  # Defaults cover tsc --build --noEmit, biome, the lockfile check, and
  # test:coverage. Token discipline is the one seed gate this job adds. The
  # production bundle is build-ui; this workflow does not build it again.
  # needs: build-ui so a broken bundle fails this job instead of only the
  # jobs that download the artifact.
  frontend:
    needs: [changes, build-ui]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-frontend.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      timeout-minutes: 15
      extra-command: ../scripts/check-token-discipline.sh

  # ===========================================================================
  # Storybook interaction and accessibility checks — fleet-shared ci-storybook.yml
  # ===========================================================================
  # Defaults are this repo's steps: npm ci, Chromium's apt deps split from
  # the browser download, test:storybook, and test:storybook:contract. The
  # apt half uses the called workflow's own apt-install pin.
  storybook:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
    uses: MustardSeedNetworks/.github/.github/workflows/ci-storybook.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Always runs — security checks are non-negotiable on every PR.
    permissions:
      contents: read
      # Uploads gosec + Trivy SARIF to the code-scanning tab. actions:read
      # is paired with security-events:write per the pattern already used in
      # codeql.yml — SARIF upload fails without it.
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap
        timeout-minutes: 10

      - name: Run govulncheck
        run: make security-backend-quiet

      # gosec is ENFORCED (blocking) by the golangci-lint job: `gosec` is an
      # enabled linter there, and high-signal rules fail the build — verified:
      # G401/G501 (weak crypto), G101 literal secrets, etc. are caught. The
      # taint/heuristic rules that are FP-prone by nature (G204 subprocess,
      # G304 file-from-variable, G115 integer-conversion) are excluded from the
      # gate via golangci-lint's `common-false-positives` preset (.golangci.yml,
      # exclusions.presets) — a deliberate, documented decision: in this codebase
      # those fire on safe dynamic paths, controlled network-tool args, and
      # already-bounds-checked SNMP conversions.
      #
      # The standalone run below scans with the DEFAULT (un-pruned) rule set and
      # exists ONLY to publish SARIF to the GitHub code-scanning / Security tab,
      # so those taint-rule findings stay visible for review. It is intentionally
      # continue-on-error (a visibility feed, not a second gate) and must not be
      # promoted to blocking — that would gate on the known FP-prone rule set the
      # golangci-lint gate intentionally excludes.
      - name: Run gosec (SARIF visibility only — gate is golangci-lint)
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        # Visibility feed, not a gate. golangci-lint already fails the build on
        # the curated gosec rules; this default ruleset is the false-positive
        # set that gate excludes, published to the Security tab as SARIF.
        continue-on-error: true
        with:
          args: "-fmt sarif -out gosec-results.sarif ./..."

      # The SCAN above stays continue-on-error -- it is a visibility feed, not a
      # second gate (gosec runs blocking inside golangci-lint). The UPLOAD is
      # different: if it fails silently the Security tab keeps showing an older
      # scan, so the dashboard says "clean" because nothing new arrived rather
      # than because nothing was found. A stale security view is worse than an
      # absent one, so this step fails loudly.
      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('gosec-results.sarif') != ''
        with:
          sarif_file: gosec-results.sarif

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Run npm audit
        run: |
          cd ui && npm ci
          cd .. && ./scripts/test-npm-audit-retry.sh
          make security-frontend-quiet

      # gitleaks-action requires a paid licence for organization repos. Use the
      # MIT-licensed gitleaks CLI directly instead — same engine, same config,
      # and identical to the version pinned in .pre-commit-config.yaml. Scans
      # the full history of HEAD only: fetch-depth: 0 also fetches every other
      # branch, and gitleaks' default --all would fail this PR on another
      # branch's finding (#2991).
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          # SHA-256 of gitleaks_8.30.0_linux_x64.tar.gz from the upstream
          # checksums.txt. Rotate this together with GITLEAKS_VERSION on upgrade.
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            --log-opts="--full-history HEAD"

      - name: Run Trivy vulnerability scanner
        # exit-code is 0 here so the SARIF always gets written; we still
        # surface findings as a separate step that fails CI when the SARIF
        # contains CRITICAL/HIGH entries.
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      # The SCAN above stays continue-on-error -- it is a visibility feed, not a
      # second gate (gosec runs blocking inside golangci-lint). The UPLOAD is
      # different: if it fails silently the Security tab keeps showing an older
      # scan, so the dashboard says "clean" because nothing new arrived rather
      # than because nothing was found. A stale security view is worse than an
      # absent one, so this step fails loudly.
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL/HIGH findings
        # Reads the SARIF Trivy just produced and fails CI if any CRITICAL or
        # HIGH-severity result is present. We do this in a separate step so
        # the SARIF is always uploaded for security tab visibility.
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: |
          if jq -e '.runs[].results[] | select(.level=="error" or .properties.security_severity == "high" or .properties.security_severity == "critical")' trivy-results.sarif >/dev/null; then
            echo "::error::Trivy found CRITICAL or HIGH severity issues — see Security tab."
            jq '.runs[].results[] | {ruleId, level, severity: .properties.security_severity, message: .message.text}' trivy-results.sarif
            exit 1
          fi

      # License compliance is handled by the dedicated license-check.yml workflow
      # to avoid duplication. See .github/workflows/license-check.yml

  # ===========================================================================
  # Semgrep SAST — required gate (Phase 4, replaces CodeQL as the required
  # SAST signal since CodeQL is skipped entirely on private repos)
  # ===========================================================================
  # Blocking on ERROR severity only for now — a deliberate first step (see
  # #1736). WARNING/MEDIUM findings are visible in the job log but do not fail
  # the build yet; ratchet to a stricter --severity once the current WARNING
  # backlog (missing-ssl-minversion, math-random-used, dependabot-missing-
  # cooldown) is triaged in a follow-up. Three known false positives are
  # already annotated inline with `// nosemgrep: <rule-id> -- <reason>`
  # (mirroring the existing `#nosec`/`//nolint:gosec` justifications) so the
  # ratchet won't need to re-litigate them: internal/auth/hibp.go (SHA-1 is
  # the HIBP k-anonymity API contract), internal/api/oauth.go (hardcoded
  # provider URL + prefix-check guard), internal/api/handlers_auth.go
  # (intentional double-submit CSRF cookie, Secure+SameSiteStrict).
  #
  # Runs unconditionally (no path filter) — same rationale as `security`
  # above: SAST coverage on every PR is non-negotiable, and Semgrep is fast
  # enough (~1-2 min for this ruleset) that gating it behind path filters
  # isn't worth the added complexity.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [semgrep]. Edit the pinned version / config policy there.
  semgrep:
    uses: MustardSeedNetworks/.github/.github/workflows/semgrep.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      contents: read
      # v1.8.0 publishes the all-severity SARIF to code scanning. The
      # upload is deliberately not continue-on-error, so this scope is
      # required, not optional.
      security-events: write

  # Refuses a PR that INTRODUCES a Go dependency carrying a High advisory,
  # whether or not the vulnerable symbol is ever called.
  #
  # The gap it closes is narrower than "nothing checks new dependencies", and
  # worth stating precisely: `npm audit --audit-level=high` already gates the
  # npm tree on *presence*, while govulncheck gates Go on *reachability* — it
  # passes a vulnerable module until something calls into it. The two halves of
  # the tree are held to different standards, so a Go dependency with a High
  # advisory can land unreachable and then fail CI on whatever unrelated PR
  # first calls into it. This gates the Go side on presence too, at the one
  # point where the fix is still "pick a different version". The shared
  # workflow's deny-licenses half duplicates license-check.yml — defence in
  # depth, not new coverage.
  #
  # pull_request only. The action diffs the PR's dependency manifests against
  # the base, so there is nothing for it to compare on a push or a merge_group;
  # ci-complete accepts success-or-skipped, so the skip on those events is not
  # a deadlock. Defined once in MustardSeedNetworks/.github (fleet-shared);
  # ci-complete still needs: [dependency-review].
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: MustardSeedNetworks/.github/.github/workflows/dependency-review.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      contents: read
      # Only to post the findings comment when it fails.
      pull-requests: write

  # Asserts this repo's own gates are wired to gate: every job below is either
  # in ci-complete's needs or documented in .github/ci-advisory-jobs.txt, the
  # enabled linters meet the declared tier, and tool installs are pinned. Two
  # such gaps were found by hand on 2026-08-16; both arrived via a merge, which
  # is why this runs per PR rather than on a schedule.
  # Defined once in MustardSeedNetworks/.github (fleet-shared); ci-complete
  # still needs: [ci-conformance].
  # `id-token: write` is how the reusable workflow learns which commit of
  # itself is running, so its policy checkout reads the pinned commit instead
  # of .github@main (a canonical change there reaches this repo only when this
  # pin moves).
  ci-conformance:
    uses: MustardSeedNetworks/.github/.github/workflows/ci-conformance.yml@76eb579ee0cbdef0a2aef9d9df1ae9ca38cad6bd # v1.14.0
    permissions:
      contents: read
      id-token: write

  # ===========================================================================
  # Code Quality Checks
  # ===========================================================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: File-size gate (baseline-ratchet)
        # Adopts niac/go's implementation, which enforces instead of warning.
        # The previous STRICT=0 mode reported violations and always exited 0,
        # so the gate was inert. Red-flag files present at adoption are
        # recorded in scripts/file-size-baseline.txt with their current size
        # and may not grow; anything new or increased fails. Sub-red-flag size
        # debt still reports as a warning without failing.
        run: ./scripts/check-file-size.sh

      - name: Enforce customer-facing vocabulary policy
        run: |
          python3 scripts/test-check-banned-vocabulary.py
          python3 scripts/check-banned-vocabulary.py

      # Separate from the vocabulary gate above on purpose: that matcher folds
      # case, which is why the articled product name cannot live in its term
      # list (stem#1267 tried and reverted it).
      - name: Enforce the article-free product name
        run: |
          python3 scripts/test-check-product-name.py
          python3 scripts/check-product-name.py

      - name: Verify the HIBP CodeQL SARIF filter
        run: python3 scripts/test-codeql-drop-hibp-weak-hash.py

      # Runs in quality, not in the bench job: the gate's own correctness does
      # not depend on benchmarks having run, and a docs-only PR skips bench.
      - name: Verify benchmark regression gate
        run: python3 scripts/test-bench-compare.py

      - name: Verify release workflow dispatch contract
        run: ./scripts/test-check-release-workflow-contract.sh

      - name: Verify the deployment validator
        run: ./scripts/test-deploy-validate.sh

      - name: Verify validate-touched's package and gate selection
        run: python3 scripts/test-validate-touched.py

      # In quality rather than bench: the retry's failure path is the half that
      # was wrong last time (#1950) and the half CI never reaches, so it needs
      # running on every PR rather than only when benchmarks do.
      - name: Verify the benchstat install retry fails closed
        run: ./scripts/test-retry-install.sh

      - name: Check for sensitive files
        run: |
          SENSITIVE=".env credentials.json secrets.yaml *.pem *.key"
          for file in $SENSITIVE; do
            if find . -name "$file" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
              echo "ERROR: Sensitive file pattern '$file' found"
              exit 1
            fi
          done
          echo "No sensitive files detected"

      - name: Check for unsafe logging patterns
        run: |
          echo "Checking for dangerous logging patterns..."

          # Patterns that may log sensitive data (excluding test files and logging package itself)
          DANGEROUS_PATTERNS=(
            'log\.Print.*r\.Body'
            'log\.Print.*bodyBytes'
            'log\.Print.*req\.Password'
            'log\.Print.*\.password'
            'log\.Print.*\.token'
            'log\.Print.*Authorization'
            'log\.Print.*X-Api-Key'
            'io\.ReadAll.*r\.Body.*log'
            'fmt\.Printf.*r\.Body'
            'fmt\.Printf.*password'
          )

          VIOLATIONS=0
          for pattern in "${DANGEROUS_PATTERNS[@]}"; do
            # Search Go files, excluding tests and the logging package
            if grep -rn -E "$pattern" \
              --include="*.go" \
              --exclude="*_test.go" \
              --exclude-dir=internal/logging \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              internal/ cmd/ 2>/dev/null; then
              echo "❌ Found dangerous logging pattern: $pattern"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo ""
            echo "ERROR: Found $VIOLATIONS unsafe logging pattern(s)"
            echo "Use internal/logging.Redact* functions to safely log data"
            echo "See internal/logging/redact.go for examples"
            exit 1
          fi

          echo "✅ No unsafe logging patterns detected"

  # Not path-gated and not gated on `changes`: a release PR touches only
  # CHANGELOG.md and the version files, and this is the job that has to judge
  # exactly that PR.
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The check compares against the previous tag, so it needs the tags
          # and the commits between them.
          fetch-depth: 0

      - name: Gate self-test
        run: python3 scripts/test-check-release-changelog.py

      # merge_group only (#2769). The queue tree is where a PR merged ahead of
      # the release PR can still eject it. On pull_request a PR opened while a
      # release PR is pending would stay red after that release merged
      # (stem#1582); on push the release is already history, and
      # release-please.yml's post-tag reconcile reports it.
      - name: An untagged release must list every commit it would ship
        if: github.event_name == 'merge_group'
        run: python3 scripts/check-release-changelog.py --pending

  # ===========================================================================
  # Darwin bridge format
  # ===========================================================================
  # seed has no C. Its only C-family sources are the cgo bridge headers next
  # to the darwin collectors, and those are checked for formatting only:
  # clang-tidy needs a compile command per file, which a Linux runner cannot
  # produce for darwin-only cgo (seed#3055).
  bridge-format:
    name: Darwin bridge format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.darwin_bridge == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        timeout-minutes: 5
        with:
          packages: clang-format-18

      - name: Check bridge header formatting
        run: git ls-files -z 'internal/**/*_darwin.h' | xargs -0 clang-format-18 --dry-run --Werror --style=file

  # ===========================================================================
  # Workflow Linting
  # ===========================================================================
  # Static analysis of the workflows themselves. Kept out of `quality` so it
  # runs in parallel and only when workflow files actually change.
  #   actionlint — syntax, expression and shell errors inside run: blocks. It
  #                caught a duplicated `with:` key in this very file that
  #                PyYAML accepts silently by keeping the last occurrence.
  #   zizmor     — Actions security scanner. Blocks on High findings only.
  #                The repo is at zero High; the two that survive review carry
  #                `# zizmor: ignore[...]` comments with the reasoning inline.
  #                Low/Informational (~25) are reported but not yet enforced.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # SC2129 is a pure style preference about grouping `>>` redirects in
          # step summaries; the ungrouped form stays readable and diffs one
          # line at a time. Every correctness-level rule stays enabled.
          actionlint -ignore 'SC2129' -color

      - name: Run zizmor
        env:
          # zizmor resolves action refs against the API; without a token it
          # falls back to unauthenticated requests and gets rate-limited.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx install zizmor==1.30.1
          zizmor --min-severity high --color always .github/workflows/


  # ===========================================================================
  # Internationalization (i18n) Checks
  # ===========================================================================
  i18n:
    name: i18n Validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci_infra == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The t()-fallback rules are semgrep rules, not grep — every text-based
      # version had a blind spot. Pinned exact, per the dependency policy; the
      # fleet SAST job pins its own copy separately.
      # The checks live once in MustardSeedNetworks/.github; this repo keeps
      # only its glossary, banned vocabulary, glossary exceptions and
      # dynamic-prefix allow-list. The action installs semgrep, self-tests the
      # key checker, then enforces I18N_CONVENTIONS.md: key parity, no empty
      # values, no t('key', 'fallback') patterns, locale vocabulary, glossary
      # preservation, interpolation parity, plural completeness, t()/<Trans>
      # key cross-reference, locked versions, and a blocking hardcoded-JSX
      # check.
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install UI dependencies for help-key analysis
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Help locale consumer gate
        run: |
          node --test scripts/check-help-i18n.test.ts
          node scripts/check-help-i18n.ts

      - name: Run shared i18n validator
        uses: MustardSeedNetworks/.github/.github/actions/i18n-validate@d2aa4161d10bf8cb5a9ffb0e0985224df0faa617 # .github#105 + #106, untagged

  # ===========================================================================
  # Documentation Checks
  # ===========================================================================
  docs:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The template check applies to every PR regardless of which paths
    # changed. External link checking is NOT here: it walks every URL in every
    # .md file, took ~6 min (the longest job in this workflow), and failed for
    # reasons unrelated to the diff — dead third-party links — which is why it
    # had been pinned to continue-on-error and therefore enforced nothing.
    # It now runs on a schedule instead: .github/workflows/docs-link-check.yml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed to diff against the base ref for changed-file scoping.
          fetch-depth: 0

      - name: Collect changed markdown files
        id: changed-md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- '*.md')
          else
            files=$(git ls-files '*.md')
          fi
          # Config-level ignores are honoured by markdownlint-cli2 itself; only
          # drop paths it never sees so an empty result skips the step cleanly.
          files=$(printf '%s\n' "${files}" | grep -vE '^(node_modules|build|dist|coverage)/' | grep -v 'CHANGELOG.md$' || true)
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "${files}" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      # Blocking, but scoped to the files this change touches. The repo carries
      # ~1.1k pre-existing violations of its own .markdownlint.json; gating the
      # full tree would fail every PR, and gating nothing (the previous
      # continue-on-error) enforced nothing. Scoping ratchets the debt down as
      # files are touched, matching the file-size gate's baseline approach.
      - name: Lint changed markdown files
        if: steps.changed-md.outputs.empty != 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ steps.changed-md.outputs.files }}

      - name: Check template references
        run: |
          echo "Verifying test report templates..."

          # Templates should exist
          TEMPLATES=(
            "docs/templates/WIFI_TEST_REPORT.md"
            "docs/templates/ETHERNET_TEST_REPORT.md"
          )

          for template in "${TEMPLATES[@]}"; do
            if [[ ! -f "$template" ]]; then
              echo "ERROR: Missing template: $template"
              exit 1
            fi
          done

          # Templates should be referenced in CONTRIBUTING.md
          if ! grep -q "WIFI_TEST_REPORT\|ETHERNET_TEST_REPORT" CONTRIBUTING.md; then
            echo "WARNING: Templates not referenced in CONTRIBUTING.md"
          fi

          echo "All test report templates are valid"

  # ===========================================================================
  # Build Verification
  # ===========================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    timeout-minutes: 25
    # Build needs the frontend-dist artifact; only runs when frontend ran.
    # The always() guard lets this job evaluate even when `backend` was
    # skipped (skipped upstream would otherwise skip this job implicitly).
    if: |
      always() &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    # The release's toolchain image, pinned to the same digest as release.yml's
    # goreleaser job, so CI and release compile both architectures with one
    # toolchain. It ships the arm64 cross compiler, which this job used to
    # apt-install from the mirror on every run (#3496). Keep the two pins equal.
    container:
      image: goreleaser/goreleaser-cross:v1.27.1-2-v2.18.2@sha256:8def7638d4f31ce8b22034694875c41c0cccb8392c9d06258c7dca9383bf1948

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark workspace as safe (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: internal/api/ui/

      # libpcap is linked statically, as the release links it. The archives
      # depend only on the build script and the image's compilers, so they are
      # cached on those and rebuilt only when one changes.
      - name: Resolve static libpcap cache key
        id: libpcap-key
        env:
          SCRIPT_HASH: ${{ hashFiles('scripts/build-static-libpcap.sh') }}
        run: |
          echo "key=libpcap-static-gcc$(gcc -dumpfullversion)-$(aarch64-linux-gnu-gcc -dumpfullversion)-${SCRIPT_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore static libpcap
        id: libpcap-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/libpcap-static
          key: ${{ steps.libpcap-key.outputs.key }}

      - name: Install libpcap build tools
        if: steps.libpcap-cache.outputs.cache-hit != 'true'
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
        timeout-minutes: 10
        with:
          packages: flex bison

      - name: Build a static libpcap for amd64 + arm64
        if: steps.libpcap-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          ./scripts/build-static-libpcap.sh /opt/libpcap-static/amd64
          ./scripts/build-static-libpcap.sh /opt/libpcap-static/arm64 \
            --host=aarch64-linux-gnu CC=aarch64-linux-gnu-gcc

      # Default branch only, like the Go cache: a PR-scoped entry is unusable
      # once the PR merges.
      - name: Save static libpcap (default branch only)
        if: |
          steps.libpcap-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/libpcap-static
          key: ${{ steps.libpcap-key.outputs.key }}

      - name: Build Go binaries (amd64 + arm64)
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # UI build hash matches Makefile recipe; mandatory per build policy.
          # Universal Build Contract — /__version must return non-empty
          # uiBuildHash to prove the UI was embedded.
          UI_BUILD_HASH=$(./scripts/ui-build-hash.sh)
          echo "UI_BUILD_HASH=${UI_BUILD_HASH}"
          for arch in amd64 arm64; do
            cc=gcc
            [ "$arch" = arm64 ] && cc=aarch64-linux-gnu-gcc
            # -L, not the archive path: the directory holds only libpcap.a, so
            # gopacket's -lpcap resolves to it (scripts/build-static-libpcap.sh).
            GOARCH=$arch CC=$cc \
              CGO_CFLAGS="-I/opt/libpcap-static/$arch/include" \
              CGO_LDFLAGS="-L/opt/libpcap-static/$arch/lib" \
              go build -trimpath -buildvcs=false \
                -ldflags="-s -w \
                  -X github.com/MustardSeedNetworks/seed/internal/version.Version=${VERSION} \
                  -X github.com/MustardSeedNetworks/seed/internal/version.Commit=${COMMIT} \
                  -X github.com/MustardSeedNetworks/seed/internal/version.BuildTime=${BUILD_TIME} \
                  -X github.com/MustardSeedNetworks/seed/internal/version.UIBuildHash=${UI_BUILD_HASH}" \
                -o "seed-linux-$arch" ./cmd/seed
          done

      - name: Verify binaries
        run: |
          echo "=== AMD64 Binary ==="
          file seed-linux-amd64
          ls -la seed-linux-amd64
          echo ""
          echo "=== ARM64 Binary ==="
          file seed-linux-arm64
          ls -la seed-linux-arm64

      - name: Verify UIBuildHash embedded (Universal Build Contract)
        # Static check: the binary must contain the md5 hash of the
        # embedded UI assets, proving the -X ...UIBuildHash=... ldflag
        # was set during go build. Failing here means /__version would
        # return uiBuildHash="unknown" in production — silent contract
        # violation. Static check is cheaper + more reliable than
        # starting the server with TLS+DB in CI.
        run: |
          if [ -z "$(find internal/api/ui -mindepth 1 ! -name '.gitkeep' -print -quit 2>/dev/null)" ]; then
            echo "::error::internal/api/ui is empty — frontend-dist artifact missing?"
            exit 1
          fi
          EXPECTED=$(./scripts/ui-build-hash.sh)
          if [ "${#EXPECTED}" -ne 32 ]; then
            echo "::error::Computed UI_BUILD_HASH is not 32 chars: '$EXPECTED'"
            exit 1
          fi
          echo "Expected UIBuildHash: $EXPECTED"
          for bin in seed-linux-amd64 seed-linux-arm64; do
            if strings "$bin" | grep -qF "$EXPECTED"; then
              echo "  ✓ $bin: UIBuildHash embedded correctly"
            else
              echo "::error::$bin does not contain UIBuildHash $EXPECTED"
              echo "  → Universal Build Contract violated. Check -X ...UIBuildHash=... ldflag in 'Build Go binary' step."
              exit 1
            fi
          done

  # ===========================================================================
  # E2E Browser Tests (Playwright) — fleet-shared ci-e2e.yml
  # ===========================================================================
  # One caller for the daemon, the sharded chromium/webkit suite, and the
  # @smoke job. The daemon is built on ubuntu-24.04 — the noble image's
  # Ubuntu release — against a static libpcap, and the shards download it.
  # The image ships the browsers, so the shard never calls apt. Drafts skip
  # the caller, so the check is skipped rather than a green workflow whose
  # inner jobs were skipped.
  #
  # !cancelled() keeps a cancelled run from launching shards. A failed or
  # skipped backend still reaches this if; frontend and build-ui have to have
  # succeeded because the daemon embeds that artifact. The test commands,
  # flake budget 0, and the two-by-two shard matrix are the workflow defaults,
  # which are this repo's scripts/run-e2e.sh invocations.
  e2e:
    needs: [changes, build-ui, backend, frontend]
    if: |
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.build-ui.result == 'success' &&
      needs.frontend.result == 'success' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    permissions:
      contents: read
      actions: write
    uses: MustardSeedNetworks/.github/.github/workflows/ci-e2e.yml@e092081a97245d29978e229be7425179cc1dcde1 # .github#163
    with:
      backend-result: ${{ needs.backend.result }}
      frontend-result: ${{ needs.frontend.result }}
      playwright-image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      ui-artifact: frontend-dist
      build-daemon: true
      static-libpcap: true
      require-static-libpcap: true
      daemon-binary: seed
      daemon-artifact: seed-e2e-daemon
      daemon-build-command: ./scripts/build-backend-e2e.sh
      timeout-minutes: 25

  # iperf3 boundary — the tests that need a real iperf3 and a real transfer
  # ===========================================================================
  # internal/diagnostics/iperf is otherwise driven through the cached-binary
  # seam against a stand-in process, so the manager's spawn, port wait, PID,
  # Wait monitor and Kill are all covered in the jobs above without iperf3.
  # What that cannot cover is iperf3 itself: the version the product refuses
  # below, and a transfer that actually moves bytes.
  #
  # Behind the `iperf3` build tag, so the default `go test ./...` never picks it
  # up. Nothing in it skips: a missing binary, a rejected version, or a transfer
  # reporting zero throughput is a failure. Until this job existed, `ci.yml` set
  # SKIP_IPERF_TEST=1 in both Go jobs, so none of it ran anywhere.
  iperf3:
    name: iperf3 boundary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # internal/api links the capture package, so its iperf3 route test needs
      # libpcap like the backend job does.
      - name: Install libpcap-dev
        uses: ./.github/actions/setup-libpcap
        timeout-minutes: 10

      # Built from source, not apt. Ubuntu's package is iperf3 3.16, and the
      # product refuses anything below 3.17 (minSupportedVersion) -- so the very
      # first run of this job failed on `ValidateVersion rejected the installed
      # iperf3 (v3.16)`. Installing a version the product will not use would
      # test nothing. Same version and checksum as the release workflow builds
      # and ships, so this job exercises what users actually get.
      - name: Build iperf3
        shell: bash
        env:
          IPERF3_VERSION: "3.21"
          # SHA-256 of the upstream release tarball; rotate with IPERF3_VERSION.
          IPERF3_SHA256: "656e4405ebd620121de7ceca3eaf43a88f79ea1b857d041a6a0b1314801acdd8"
        run: |
          set -euo pipefail
          build_dir=$(mktemp -d)
          trap 'rm -rf "$build_dir"' EXIT
          curl -sSfL -o "$build_dir/iperf3.tar.gz" \
            "https://github.com/esnet/iperf/releases/download/${IPERF3_VERSION}/iperf-${IPERF3_VERSION}.tar.gz"
          echo "${IPERF3_SHA256}  $build_dir/iperf3.tar.gz" | sha256sum -c -
          tar -xzf "$build_dir/iperf3.tar.gz" -C "$build_dir"
          cd "$build_dir/iperf-${IPERF3_VERSION}"
          ./configure --prefix=/usr/local --disable-shared --enable-static-bin
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig || true

      # Fail here, with the version printed, rather than inside a test: a
      # missing or too-old iperf3 is a job-setup problem and should read as one.
      - name: Verify iperf3 is present and new enough
        run: |
          set -euo pipefail
          command -v iperf3
          iperf3 --version
          version=$(iperf3 --version | head -1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          minimum=$(grep -oE 'minSupportedVersion = "[0-9.]+"' internal/diagnostics/iperf/iperf.go \
            | grep -oE '[0-9.]+')
          echo "installed=$version product-minimum=$minimum"
          # sort -V puts the lower version first; if that is not the minimum,
          # the installed one is older than the product will accept.
          if [ "$(printf '%s\n%s\n' "$minimum" "$version" | sort -V | head -1)" != "$minimum" ]; then
            echo "::error::iperf3 $version is below the product minimum $minimum"
            exit 1
          fi

      - name: Run the iperf3 boundary suite
        env:
          SEED_IPERF3_TESTS: "1"
        run: go test -count=1 -tags iperf3 -run 'TestReal_' -v ./internal/diagnostics/iperf/ ./internal/api/

  # Phone width (owner 2026-09-15: everything works at 390x844). The fleet's one
  # definition of "works" lives in MustardSeedNetworks/.github; this job points
  # it at seed's own daemon, since every route is behind a session and a static
  # serve would answer each one with the login screen. The binary is the E2E
  # build without cgo (the reusable workflow has no libpcap), started by the
  # same script and config as scripts/run-e2e.sh; phone-width-sign-in.ts signs
  # it in with the gate's own Playwright. `routes` must equal pageRegistry's
  # paths — src/pageRegistry.test.tsx fails when the two diverge.
  phone-width:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci_infra == 'true'
    permissions:
      contents: read
      id-token: write
    uses: MustardSeedNetworks/.github/.github/workflows/phone-width.yml@042e037814c114aadc2b8b2caaedfba8e0149018 # .github#88, untagged
    with:
      base-url: https://127.0.0.1:8443
      prepare-command: CGO_ENABLED=0 ./scripts/build-backend-e2e.sh
      start-command: ./scripts/e2e-daemon.sh "$RUNNER_TEMP/seed-phone-width" 8443
      setup-command: node ui/e2e/phone-width-sign-in.ts
      storage-state: phone-width-state.json
      routes: '["/dashboard", "/link", "/network", "/path", "/wifi", "/security", "/performance", "/reports", "/logs", "/polling-targets", "/device-groups", "/topology", "/interfaces", "/device-configs", "/flows", "/alerts"]'
      rail-testid: sidebar-desktop
      primary-action-testid: fab-run-all-tests

  # Fails the build on any open High/Critical CodeQL alert on the default
  # branch. The CodeQL job itself reports success when the *analysis* succeeds,
  # regardless of what it found, so without this a repository can carry open
  # High alerts with every check green. Scoped to CodeQL rather than "any High
  # alert": the code-scanning tab also carries Scorecard *scores* at High
  # severity, several of which encode deliberate decisions.
  codeql-alert-gate:
    name: CodeQL Alert Gate
    uses: MustardSeedNetworks/.github/.github/workflows/codeql-alert-gate.yml@048d173dd72ca0f9e5fa832fb5b9fd2a6447e5e9 # v1.13.0
    permissions:
      security-events: read


  # ===========================================================================
  # CI Complete — dispatcher / branch-protection aggregator
  # ===========================================================================
  # Not the shared ci-complete.yml. GitHub would report that check as
  # `ci-complete / CI Complete`. Branch protection and release.yml require
  # the plain name `CI Complete`, so the aggregator stays in this file.
  #
  # It fails if any upstream job actually failed; it passes if every upstream
  # either succeeded or was intentionally skipped via the path filter. Branch
  # protection requires ONLY "CI Complete" (plus "Lint PR Title" / "Lint PR
  # Body" from their own workflows). CodeQL and license-check are not required
  # contexts. The semgrep job in this file is the required SAST gate.
  #
  # macOS, Windows, and the GOOS=windows lint run inside the backend caller.
  # The E2E daemon, the sharded browser suite, and smoke run inside the e2e
  # caller. A failed inner job fails that caller, so this list needs the
  # caller, not each shard. A docs-only PR skips those callers and still
  # passes.
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build-ui
      - backend
      - race
      - bench
      - frontend
      - storybook
      - security
      - semgrep
      - dependency-review
      - ci-conformance
      - quality
      - release-notes
      - bridge-format
      - workflow-lint
      - i18n
      - docs
      - build
      - e2e
      - iperf3
      - phone-width
      - codeql-alert-gate
    # Run when an upstream failed, and stay skipped when the run was
    # cancelled. always() would still execute, see the cancelled upstreams,
    # and turn that cancellation into a failure.
    if: ${{ !cancelled() }}
    steps:
      - name: Verify upstream results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          echo "$RESULTS" | jq '.'
          # Fail if any upstream is anything other than success or skipped.
          # (cancelled and failure both fail this gate.)
          if ! echo "$RESULTS" | jq -e 'to_entries | map(.value.result) | all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::One or more required CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All required CI jobs passed (or were intentionally skipped)."
