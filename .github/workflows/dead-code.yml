# =============================================================================
# Dead Code Detection Workflow
# =============================================================================
# Weekly audit for unused code, dead files, and orphaned exports.
# Generates summary reports to help keep the codebase clean.
#
# NOTE: This complements (does not duplicate) ci.yml:
# - ci.yml's golangci-lint run includes the staticcheck linter on every PR
#   (blocks merge if issues found); this job adds the unused-code checks only
# - This workflow runs ONLY unused code checks (U*) weekly for reporting
#
# Checks:
# - Go: unused functions, variables, types (go tool staticcheck -checks="U*")
# - Go: unused dependencies (go mod tidy)
# - TypeScript: unused exports (ts-prune)
# - Files: orphaned files not imported anywhere
# =============================================================================

# Dead-code analysis.
#
# One step gates: "Check package reachability" fails the job when an internal
# package is reachable from no binary and is not recorded in
# scripts/package-reachability-baseline.txt.
#
# Every other step in this workflow is advisory by design — staticcheck's
# unused checks and ts-prune both produce false positives on interfaces,
# generated code and platform-gated files, so they write to the step summary
# and do not fail. A green run on this workflow therefore means "no NEW
# unreachable packages", not "no dead code".
name: Dead Code Detection

on:
  schedule:
    # Run weekly on Tuesday at 9am UTC
    - cron: '0 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-dead-code:
    name: Go Dead Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap-dev
        uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
        timeout-minutes: 10
        # The hand-rolled wrapper this replaces ran `timeout ... sudo apt-get`,
        # which cannot reap the root-owned apt-get it starts: an unprivileged
        # uid may not signal a root process, so a killed attempt left an
        # apt-get alive holding /var/lib/dpkg/lock-frontend and the retry
        # blocked on the process the previous attempt leaked. See #1950.
        with:
          packages: libpcap-dev

      # The one step in this workflow that can fail. Everything below reports
      # into the step summary and returns success regardless, which is
      # defensible for a fuzzy signal like "possibly unused export" but meant
      # this job reported success weekly while two packages totalling 2,800
      # lines sat unreachable in stem (stem#798).
      #
      # Reachability is not a fuzzy signal. Either a binary can reach a package
      # or it cannot, `go list -deps` says which in about a second, and
      # staticcheck's unused checks structurally cannot: they find unused
      # identifiers inside a package being compiled, and a package nobody
      # imports still looks used from within its own tests.
      - name: Check package reachability
        run: ./scripts/check-package-reachability.sh

      - name: Run staticcheck for unused code
        run: |

          echo "### Go Dead Code Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Run staticcheck and capture unused code warnings
          go tool staticcheck -checks="U*" ./... 2>&1 | tee staticcheck-unused.txt || true

          UNUSED_COUNT=$(wc -l < staticcheck-unused.txt | tr -d ' ')
          echo "Found $UNUSED_COUNT potential unused code items" >> "$GITHUB_STEP_SUMMARY"

          if [ "$UNUSED_COUNT" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat staticcheck-unused.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for unused dependencies
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Unused Go Dependencies" >> "$GITHUB_STEP_SUMMARY"

          # Check if go mod tidy would change anything
          cp go.mod go.mod.backup
          cp go.sum go.sum.backup

          go mod tidy

          if ! diff -q go.mod go.mod.backup > /dev/null 2>&1; then
            echo "go.mod has unused dependencies:" >> "$GITHUB_STEP_SUMMARY"
            diff go.mod.backup go.mod >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "No unused dependencies found" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Restore original files
          mv go.mod.backup go.mod
          mv go.sum.backup go.sum

  frontend-dead-code:
    name: Frontend Dead Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install ts-prune
        run: npm install -g ts-prune

      - name: Check for unused exports
        working-directory: ui
        run: |
          echo "### Frontend Dead Code Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Run ts-prune to find unused exports
          ts-prune --error 2>&1 | tee ts-prune-output.txt || true

          UNUSED_COUNT=$(grep -c "unused" ts-prune-output.txt || echo "0")
          echo "Found $UNUSED_COUNT potentially unused exports" >> "$GITHUB_STEP_SUMMARY"

          if [ "$UNUSED_COUNT" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            head -50 ts-prune-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for unused npm dependencies
        working-directory: ui
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Unused npm Dependencies" >> "$GITHUB_STEP_SUMMARY"

          npx depcheck --json 2>/dev/null | tee depcheck-output.json || true

          # Parse results
          UNUSED=$(jq -r '.dependencies[]' depcheck-output.json 2>/dev/null | wc -l || echo "0")
          DEV_UNUSED=$(jq -r '.devDependencies[]' depcheck-output.json 2>/dev/null | wc -l || echo "0")

          if [ "$UNUSED" -gt 0 ] || [ "$DEV_UNUSED" -gt 0 ]; then
            echo "Potentially unused dependencies:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat depcheck-output.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No unused dependencies detected" >> "$GITHUB_STEP_SUMMARY"
          fi

  orphaned-files:
    name: Orphaned Files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for orphaned files
        run: |
          echo "### Orphaned File Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Find Go files not imported anywhere
          echo "#### Go Files" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r -d '' file; do
            pkg=$(dirname "$file" | sed 's|^\./||')
            # Check if package is imported
            if ! grep -r "\"github.com/MustardSeedNetworks/seed/$pkg\"" --include="*.go" . > /dev/null 2>&1; then
              # Check if it's a main package or has exported symbols
              if grep -q "^package main" "$file"; then
                continue  # Main packages don't need to be imported
              fi
              echo "- Potentially orphaned: $file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find . -name "*.go" -not -path "./vendor/*" -not -name "*_test.go" -print0) || echo "All Go packages appear to be used" >> "$GITHUB_STEP_SUMMARY"

          # Find TypeScript files not imported anywhere
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### TypeScript Files" >> "$GITHUB_STEP_SUMMARY"
          cd ui/src
          while IFS= read -r file; do
            basename=$(basename "$file" | sed 's/\.[^.]*$//')
            # Check if file is imported
            if ! grep -r "from.*['\"].*${basename}['\"]" --include="*.ts" --include="*.tsx" . > /dev/null 2>&1; then
              if ! grep -r "import.*${basename}" --include="*.ts" --include="*.tsx" . > /dev/null 2>&1; then
                echo "- Potentially orphaned: $file" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done < <(find . \( -name "*.tsx" -o -name "*.ts" \) | grep -v ".test." | grep -v ".stories." | grep -v ".d.ts") || echo "All TypeScript files appear to be used" >> "$GITHUB_STEP_SUMMARY"
