name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC

jobs:
  analyze:
    # Skip CodeQL on private repos unless explicitly enabled
    if: ${{ github.event.repository.visibility == 'public' }}
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # config-file selects the query suites. The weak-hash query stays
          # enabled; the HIBP result is removed after analysis, below.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          # Keep the SARIF local. failure-only does not upload alerts on
          # success; the next steps remove the one HIBP result and upload
          # the rest. On merge_group the code-scanning API rejects the
          # deleted queue ref, so a failure upload must not run either.
          upload: ${{ github.event_name == 'merge_group' && 'never' || 'failure-only' }}
          output: ${{ runner.temp }}/codeql-sarif

      - name: Drop the HIBP weak-hash result
        if: matrix.language == 'go'
        env:
          SARIF: ${{ runner.temp }}/codeql-sarif/go.sarif
        run: python3 scripts/codeql-drop-hibp-weak-hash.py "$SARIF"

      # Skip on merge_group. This workflow is not triggered there today;
      # the condition is so a later trigger cannot fail the job when the
      # queue ref has already been deleted ("ref not found"). Analysis
      # above still runs whenever the job does.
      - name: Upload CodeQL results
        if: github.event_name != 'merge_group'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: "/language:${{ matrix.language }}"
