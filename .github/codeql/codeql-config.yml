# =============================================================================
# CodeQL configuration for seed
# =============================================================================
# Extends the default Go + JavaScript/TypeScript analysis with the
# security-extended and security-and-quality query suites.
#
# A finding that is a false positive in one place is suppressed on that
# line. A query-filter would disable the rule for the whole repository.
# internal/auth/hibp.go suppresses go/weak-sensitive-data-hashing on the
# HIBP SHA-1 call; the range API requires it and the digest is not stored.
# =============================================================================

name: "Seed CodeQL config"

queries:
  - uses: security-extended
  - uses: security-and-quality
