name: 'Setup libpcap'
description: 'Install libpcap-dev with caching'
runs:
  using: composite
  steps:
    - name: Cache apt packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-apt
      with:
        path: |
          /var/cache/apt/archives/*.deb
        key: apt-libpcap-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          apt-libpcap-${{ runner.os }}-

    - name: Install libpcap-dev
      shell: bash
      # A composite step cannot carry timeout-minutes, so apt's own waits are
      # bounded here instead. By default apt blocks forever on a dead mirror
      # connection: one such stall hung an install for 25 minutes and burned a
      # whole job without running anything (niac job 95072124340).
      run: |
        # Waiting for the lock is necessary but not sufficient. Run 32151357882
        # waited the full DPkg::Lock::Timeout and still exited 100, the lock held
        # for the whole ~8.7-minute step by the runner's own periodic apt units
        # (process 7051; 7020 and 6971 in other runs — it recurs).
        #
        # Those units keep a long-lived host patched and have no purpose on a
        # single-use CI runner, so stop them rather than wait on work we do not
        # want done. Do NOT use `systemctl stop --no-block`: it queues the stop
        # and returns immediately, so the apt-get child still holds the lock when
        # the install starts — that is how run 32155035466 failed with the units
        # already stopped. Stop synchronously, then wait on the lock itself
        # rather than trusting unit state.
        #
        # The patient DPkg::Lock::Timeout below stays as the backstop for anything
        # else that takes the lock.
        sudo timeout 120 systemctl stop \
          apt-daily.timer apt-daily-upgrade.timer \
          apt-daily.service apt-daily-upgrade.service \
          unattended-upgrades.service >/dev/null 2>&1 || true
        for _ in $(seq 1 60); do
          sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
          sleep 2
        done
        # Stopping apt mid-transaction can leave dpkg half-configured.
        sudo dpkg --configure -a >/dev/null 2>&1 || true

        sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "240";
        EOF
        for attempt in 1 2; do
          if [ "$attempt" -gt 1 ]; then
            # A timeout kill can leave dpkg half-configured; recover first.
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          fi
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            timeout -k 15 270 sudo apt-get update || true
          fi
          if timeout -k 15 270 sudo apt-get install -y libpcap-dev; then
            exit 0
          fi
          echo "libpcap-dev install attempt ${attempt} failed; retrying in $((attempt * 10))s..."
          sleep $((attempt * 10))
        done
        echo "::error::libpcap-dev install failed after 2 attempts"
        exit 1
