name: 'Setup libpcap'
description: 'Install libpcap-dev with caching'
runs:
  using: composite
  steps:
    - name: Cache apt packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-apt
      with:
        path: |
          /var/cache/apt/archives/*.deb
        key: apt-libpcap-${{ runner.os }}-${{ runner.arch }}
        restore-keys: |
          apt-libpcap-${{ runner.os }}-

    # Delegates to the fleet composite rather than hand-rolling the wrapper.
    # The hand-rolled version this replaces ran `timeout … sudo apt-get`, which
    # cannot reap the root-owned apt-get it starts: an unprivileged uid may not
    # signal a root process, so a killed attempt leaves an apt-get alive holding
    # /var/lib/dpkg/lock-frontend and the retry blocks on the process the last
    # attempt leaked. See #1950. The shared composite runs timeout as root and
    # clears any holder that survives.
    #
    # A composite step cannot carry timeout-minutes, so callers must keep a
    # step-level timeout of at least 10 minutes as the outer backstop —
    # the composite's own worst case is 2 x 270 + 10 = 550s.
    - name: Install libpcap-dev
      uses: MustardSeedNetworks/.github/.github/actions/apt-install@37513d7fbaacf4a7adaab1ac1514f021115868d1 # v1.4.0
      with:
        packages: libpcap-dev
        update: ${{ steps.cache-apt.outputs.cache-hit != 'true' }}
