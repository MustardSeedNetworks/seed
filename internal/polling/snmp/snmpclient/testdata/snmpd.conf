# net-snmp fixture for seed's SNMP integration suite.
#
# Loopback only, unprivileged port, read-only. Nothing here is a credential —
# "public" is the SNMP equivalent of "localhost" and the agent serves nothing
# but its own system group and interface table.
agentaddress udp:127.0.0.1:1161
rocommunity public 127.0.0.1

# A device that serves only the RFC 1213 ipRouteTable, as plenty of older
# agents do (seed#2587): the route readers must fall back to it when the
# IP-FORWARD-MIB tables come back empty.
view        legacyroutes included .1.3.6.1.2.1.1
view        legacyroutes included .1.3.6.1.2.1.4.21
rocommunity legacyroutes 127.0.0.1 -V legacyroutes

# The suite asserts on these exact strings. That is the point: a value that
# survives the agent's BER encoder and gosnmp's decoder unchanged proves the
# wire format, which a fake client cannot.
sysDescr    Seed integration test agent
sysObjectID 1.3.6.1.4.1.8072.3.2.10
sysName     seed-snmp-fixture
sysContact  seed-ci@example.invalid
sysLocation integration-fixture
